name: Configure on-demand BuildKit cache
description: Serve remote cache manifests and layers as the builder requests them.
inputs:
  cache-only:
    required: true
    description: Require cache-only image build steps
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "CI_BUILDKIT_CACHE_ENDPOINT=$CI_DEPENDENCY_REGISTRY_ENDPOINT/buildkit-cache" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/buildkit-registry"
        echo "EXTERNAL_REGISTRY_VOLUME=$RUNNER_TEMP/buildkit-registry" >> "$GITHUB_ENV"
    - if: inputs.cache-only == 'true'
      shell: bash
      run: |
        # Block forwarded packets before Docker's filter rules. Keep traffic between
        # Docker/kind networks and the job's local registry and broker available.
        nic=$(ip -4 route show default | awk 'NR==1 {print $5}')
        test -n "$nic"
        sudo mkdir -p /sys/fs/cgroup/migrations-local-tests
        for firewall in iptables ip6tables; do
          sudo "$firewall" -w 5 -t mangle -I OUTPUT 1 -o "$nic" -m cgroup --path migrations-local-tests -j DROP
          sudo "$firewall" -w 5 -t mangle -I FORWARD 1 -o "$nic" -j DROP
          sudo "$firewall" -w 5 -t mangle -C FORWARD -o "$nic" -j DROP
        done
        # Probe the same allowed HTTPS address before and inside the restricted shell.
        ip=$(getent ahostsv4 api.github.com | awk 'NR==1 {address=$1} END {print address}')
        test -n "$ip"
        tcp_probe='import socket,sys; socket.create_connection((sys.argv[1],443),timeout=4).close()'
        python3 -c "$tcp_probe" "$ip"
        if CI_DEPENDENCY_STRICT_READ=1 bash "$GITHUB_ACTION_PATH/test-shell.sh" -c 'python3 -c "$1" "$2"' bash "$tcp_probe" "$ip"; then
          echo "::error::An external TCP connection succeeded from a cache-only test process"
          exit 1
        fi
        CI_DEPENDENCY_STRICT_READ=1 bash "$GITHUB_ACTION_PATH/test-shell.sh" -c 'curl -fsS --max-time 5 "${CI_DEPENDENCY_PROXY_URL%/}/v2/" >/dev/null'

        # Reuse the verified local image. Probe the Docker bridge with the host's Python.
        image=$(jq -er .postgres <<< "$CI_BOOTSTRAP_IMAGE_IDS")
        probe=$(docker run --pull=never -d --network bridge --entrypoint sleep "$image" 30)
        trap 'docker rm -f "$probe" >/dev/null' EXIT
        pid=$(docker inspect --format '{{.State.Pid}}' "$probe")
        sudo nsenter --net --target "$pid" /usr/bin/curl -fsS --max-time 5 "http://$CI_DEPENDENCY_REGISTRY_ENDPOINT/v2/" >/dev/null
        if sudo nsenter --net --target "$pid" /usr/bin/python3 -c "$tcp_probe" "$ip"; then
          echo "::error::An external TCP connection succeeded from a cache-only container"
          exit 1
        fi
        echo "The local dependency broker was reachable and external TCP was denied from the test process and container." >> "$GITHUB_STEP_SUMMARY"
