name: Setup CI Environment
description: Sets up all required runtimes and environment versions
inputs:
  gradle-cache-enabled:
    description: 'Enable Gradle cache restore'
    required: false
    default: 'false'
  gradle-cache-read-only:
    description: 'Gradle cache read-only mode (no save)'
    required: false
    default: 'true'
  dependency-proxy-enabled:
    description: 'Route supported CI dependencies through the per-job read or record proxy'
    required: false
    default: 'false'
  dependency-proxy-docker:
    description: 'Route Docker clients on disposable jobs that already use their own Docker daemon'
    required: false
    default: 'false'
  java-required:
    description: 'Provision Corretto and configure Gradle for jobs that run Java when dependency caching is enabled'
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: 3.11

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22.x

    - uses: ./.github/actions/install-dependency-toolkit
      if: inputs.dependency-proxy-enabled == 'true'

    - name: Start dependency cache
      if: inputs.dependency-proxy-enabled == 'true'
      uses: ./.github/actions/dependency-cache
      env:
        CI_SERVICE_IMAGE_CACHE_KEY: dependency-service-images-v1-${{ runner.arch }}-${{ hashFiles('.github/ci/dependency-cache/openartifact/images.json') }}
        CI_CACHE_TRUSTED_DOCKER: ${{ inputs.dependency-proxy-docker == 'true' && '1' || '0' }}
        CI_GRADLE_REMOTE_CACHE: ${{ inputs.java-required == 'true' && 'true' || 'false' }}
      with:
        catalog-token: ${{ github.token }}
        mode: ${{ env.CI_DEPENDENCY_STRICT_READ != '1' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && 'record' || 'read' }}

    - name: Fetch the pinned Corretto JDK for this runner
      id: corretto
      if: inputs.dependency-proxy-enabled == 'true' && inputs.java-required == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node .github/ci/dependency-cache/corretto.cjs

    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      if: inputs.dependency-proxy-enabled != 'true' || inputs.java-required == 'true'
      with:
        distribution: ${{ inputs.dependency-proxy-enabled == 'true' && 'jdkfile' || 'corretto' }}
        java-version: ${{ steps.corretto.outputs.java-version || '21' }}
        jdkFile: ${{ steps.corretto.outputs.archive }}

    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      if: inputs.dependency-proxy-enabled != 'true' || inputs.java-required == 'true'
      with:
        cache-disabled: ${{ inputs.gradle-cache-enabled != 'true' || inputs.dependency-proxy-enabled == 'true' }}
        cache-read-only: ${{ inputs.gradle-cache-read-only }}

    - name: Aggressive disk cleanup
      shell: bash
      run: |
        # Remove .NET SDKs
        sudo rm -rf /usr/share/dotnet || true

        # Remove Swift toolchain
        sudo rm -rf /usr/share/swift || true

        # Remove Haskell (GHC)
        sudo rm -rf /usr/local/.ghcup || true

        # Remove Julia
        sudo rm -rf /usr/local/julia* || true

        # Remove Android SDKs
        sudo rm -rf /usr/local/lib/android || true

        # Remove Chromium (optional if not using for browser tests)
        sudo rm -rf /usr/local/share/chromium || true

        # Remove Microsoft/Edge and Google Chrome builds
        sudo rm -rf /opt/microsoft /opt/google || true

        # Remove Azure CLI
        sudo rm -rf /opt/az || true

        # Remove PowerShell
        sudo rm -rf /usr/local/share/powershell || true
