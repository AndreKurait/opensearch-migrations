name: Test a Terraform module
description: Run plan-time tests with an on-demand provider mirror.
inputs:
  module:
    required: true
    description: Terraform module path
  cache-only:
    required: true
    description: Require cached CLI and provider requests
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-dependency-toolkit
    - uses: ./.github/actions/dependency-cache
      with:
        catalog-token: ${{ github.token }}
        mode: ${{ inputs.cache-only != 'true' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && 'record' || 'read' }}
    - id: installed
      shell: bash
      run: |
        tools="$RUNNER_TEMP/terraform-tools"
        mkdir -p "$tools"
        if command -v terraform >/dev/null && CHECKPOINT_DISABLE=1 terraform version -json | jq -e '.terraform_version == "1.17.2"' >/dev/null; then
          binary=$(command -v terraform)
          ln -L "$binary" "$tools/terraform" 2>/dev/null || cp "$binary" "$tools/terraform"
          echo 'available=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Restore the requested Terraform CLI
      id: cli
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/terraform-tools/terraform
        key: terraform-cli-v1-${{ runner.os }}-${{ runner.arch }}-1.17.2
        lookup-only: ${{ steps.installed.outputs.available == 'true' }}
        fail-on-cache-miss: ${{ steps.installed.outputs.available != 'true' && inputs.cache-only == 'true' }}
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      if: steps.installed.outputs.available != 'true' && steps.cli.outputs.cache-hit != 'true'
      with:
        terraform_version: 1.17.2
        terraform_wrapper: false
    - if: steps.installed.outputs.available != 'true' && steps.cli.outputs.cache-hit != 'true'
      shell: bash
      run: cp "$(command -v terraform)" "$RUNNER_TEMP/terraform-tools/terraform"
    - name: Publish reusable CLI
      if: steps.cli.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && inputs.cache-only != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/terraform-tools/terraform
        key: terraform-cli-v1-${{ runner.os }}-${{ runner.arch }}-1.17.2
    - name: Run Terraform tests with on-demand provider downloads
      shell: bash
      working-directory: ${{ inputs.module }}
      env:
        CHECKPOINT_DISABLE: '1'
        TF_IN_AUTOMATION: 'true'
      run: |
        set -euo pipefail
        tools="$RUNNER_TEMP/terraform-tools"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' \
          -addext 'subjectAltName=IP:127.0.0.1' -keyout "$tools/key.pem" -out "$tools/cert.pem" 2>/dev/null
        export SSL_CERT_FILE="$tools/cert.pem" TF_CLI_CONFIG_FILE="$tools/mirror.rc"
        python3 "$GITHUB_ACTION_PATH/mirror.py" "$tools/cert.pem" "$tools/key.pem" "$TF_CLI_CONFIG_FILE" &
        mirror_pid=$!
        trap 'kill "$mirror_pid" 2>/dev/null || true' EXIT
        for attempt in {1..100}; do
          [[ -s "$TF_CLI_CONFIG_FILE" ]] && break
          kill -0 "$mirror_pid"
          sleep 0.1
        done
        test -s "$TF_CLI_CONFIG_FILE"
        "$tools/terraform" init -backend=false
        "$tools/terraform" test -junit-xml="$tools/junit.xml"
    - name: Upload Terraform JUnit report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: terraform-test-${{ github.job }}
        path: ${{ runner.temp }}/terraform-tools/junit.xml
        if-no-files-found: warn
