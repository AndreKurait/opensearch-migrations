name: Close cancelled AWS PR statuses
on:
  workflow_run:
    workflows: [AWS integration tests]
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  reconcile:
    if: >-
      github.repository == 'AndreKurait/opensearch-migrations' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.path == '.github/workflows/aws-integration.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'issue_comment' || github.event.workflow_run.event == 'workflow_dispatch')
    concurrency:
      group: aws-integration-pr-status
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Close pending statuses for this cancelled attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/controller/status.py cancelled
