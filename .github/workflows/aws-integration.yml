name: AWS integration tests
run-name: AWS tests · ${{ github.event_name == 'issue_comment' && format('PR {0}', github.event.issue.number) || github.event.schedule || inputs.suite || github.ref_name }}
on:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  schedule:
    - cron: '13 */2 * * *'
    - cron: '27 */6 * * *'
    - cron: '41 */12 * * *'
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Integration suite or group
        default: all
        options: [all, eks, cdc, cdc-aoss, cdc-k6, cfn-create, cfn-import, isolated, cdc-tests]
      release:
        type: string
        description: Optional published Migration Assistant release version (default builds from source)
      pr:
        type: string
        description: Optional PR number (requires its current head SHA)
      sha:
        type: string
        description: Full reviewed PR head SHA
      parameters:
        type: string
        description: Optional single-suite JSON parameters (see TESTING.md)
        default: '{}'
permissions: {}
jobs:
  select:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/aws-test ')))
    environment:
      name: aws-ci
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      ref: ${{ steps.plan.outputs.ref }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.plan.outputs.release }}
      pr: ${{ steps.plan.outputs.pr }}
      parameters: ${{ steps.plan.outputs.parameters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the request and select suites
        id: plan
        env:
          AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/controller/plan.py
      - name: Link the queued suites to the approved PR commit
        if: steps.plan.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.plan.outputs.sha }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          while read -r suite; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -X POST --silent \
              -f state=pending -f context="aws-integration/$suite" \
              -f description='Approved and queued for Oregon capacity' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done < <(jq -r '.[].suite' <<< "$MATRIX")
  test:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.suite }}
    permissions:
      contents: read
      id-token: write
      statuses: write
    uses: ./.github/workflows/aws-suite.yml
    with:
      sha: ${{ needs.select.outputs.sha }}
      ref: ${{ needs.select.outputs.ref }}
      pr: ${{ needs.select.outputs.pr }}
      suite: ${{ matrix.suite }}
      lane: ${{ matrix.lane }}
      parameters: ${{ needs.select.outputs.parameters }}
      release: ${{ needs.select.outputs.release }}
