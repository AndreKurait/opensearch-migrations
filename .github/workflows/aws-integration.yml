name: AWS integration tests
run-name: AWS tests · ${{ github.event_name == 'issue_comment' && format('PR {0}', github.event.issue.number) || github.event.schedule || inputs.suite || github.ref_name }}
on:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  schedule:
    - cron: '13 */2 * * *'
    - cron: '27 */6 * * *'
    - cron: '41 */12 * * *'
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        type: string
        description: Suite, group, or comma-separated selections (default is the deployment check)
      release:
        type: string
        description: Optional published Migration Assistant release version (default builds from source)
      pr:
        type: string
        description: Optional PR number (requires its current head SHA)
      sha:
        type: string
        description: Full reviewed PR head SHA
      parameters:
        type: string
        description: Optional single-suite JSON parameters (see TESTING.md)
        default: '{}'
permissions: {}
jobs:
  select:
    concurrency:
      group: ${{ (github.event_name == 'issue_comment' || inputs.pr != '') && 'aws-integration-pr-status' || format('aws-select-{0}', github.run_id) }}
      queue: max
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' ||
      (github.event_name != 'push' && github.event_name != 'schedule')) &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/aws-test ')))
    environment:
      name: aws-ci
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      ref: ${{ steps.plan.outputs.ref }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.plan.outputs.release }}
      pr: ${{ steps.plan.outputs.pr }}
      parameters: ${{ steps.plan.outputs.parameters }}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the request and select suites
        id: plan
        env:
          AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/controller/plan.py
      - name: Save the approved PR status plan
        if: steps.plan.outputs.pr != ''
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: python3 .github/ci/controller/status.py plan
      - if: steps.plan.outputs.pr != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aws-approved-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Link the queued suites to the approved PR commit
        if: steps.plan.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/controller/status.py pending
  test:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.suite }}
    permissions:
      contents: read
      id-token: write
      statuses: write
      actions: write
    uses: ./.github/workflows/aws-suite.yml
    secrets:
      AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
    with:
      sha: ${{ needs.select.outputs.sha }}
      ref: ${{ needs.select.outputs.ref }}
      pr: ${{ needs.select.outputs.pr }}
      suite: ${{ matrix.suite }}
      lane: ${{ matrix.lane }}
      parameters: ${{ needs.select.outputs.parameters }}
      release: ${{ needs.select.outputs.release }}
