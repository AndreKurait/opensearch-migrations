name: Deploy schema viewer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'schema-viewer/**'
      - '.github/workflows/deploy-schema-viewer.yml'
  release:
    # "released" covers promotion from a pre-release to a full release.
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Release tags cannot deploy to the github-pages environment (restricted to main/2.x branches).
  # Re-dispatch on main so the protection rules are satisfied; the deploy job then fetches all
  # released schemas via the GitHub API, including the one that triggered this run.
  redispatch-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
      - &enforce_unprivileged
        name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - name: Trigger deploy from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-schema-viewer.yml \
            --repo ${{ github.repository }} \
            --ref main

  deploy:
    if: github.event_name != 'release' && (github.repository != 'AndreKurait/opensearch-migrations' || vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event_name == 'workflow_dispatch')
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
            pages.github.com:443
      - *enforce_unprivileged
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch schemas from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p schema-viewer/schemas

          # Fetch all releases that include the schema asset (newest first)
          gh api repos/opensearch-project/opensearch-migrations/releases \
            --paginate \
            --jq '.[] | select(.assets | map(.name) | contains(["workflowMigration.schema.json"]))
                      | .tag_name + " " + (.assets[] | select(.name == "workflowMigration.schema.json") | .browser_download_url)' \
            > /tmp/schema-releases.txt

          declare -a versions
          while IFS=' ' read -r tag url; do
            echo "Downloading schema for $tag..."
            curl -fsSL "$url" -o "schema-viewer/schemas/${tag}.json"
            versions+=("$tag")
          done < /tmp/schema-releases.txt

          node - "${versions[@]}" <<'EOF'
          const fs = require('fs')
          const versions = process.argv.slice(2)
          if (versions.length === 0) { console.error('No schema versions found'); process.exit(1) }
          const meta = { latest: versions[0], versions }
          fs.writeFileSync('schema-viewer/schemas/versions.json', JSON.stringify(meta, null, 2) + '\n')
          console.log(`Generated versions.json: latest=${meta.latest}, count=${versions.length}`)
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: schema-viewer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
