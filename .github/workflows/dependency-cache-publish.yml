name: Run protected dependency publisher
on:
  workflow_call:
    inputs:
      receipt: {type: string, default: ''}
      build: {type: string, default: ''}
      sha: {type: string, required: true}
      seed: {type: boolean, default: false}
    secrets:
      AWS_CI_CONFIG: {required: true}
permissions: {}
jobs:
  publish:
    if: github.repository == 'AndreKurait/opensearch-migrations' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: aws-ci
    permissions: {contents: read, id-token: write}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
            sts.us-west-2.amazonaws.com:443 sts.amazonaws.com:443 codebuild.us-west-2.amazonaws.com:443 ssm.us-west-2.amazonaws.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=cbe9fcb83fbc2c55d5734c9640f58696755156d3f9b68467f3672c35e2a6aec5
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.workflow_sha }}', persist-credentials: false}
      - uses: ./.github/actions/aws-sandbox
        with:
          config: ${{ secrets.AWS_CI_CONFIG }}
          duration: '10800'
          role: MigrationsGitHubCacheLauncher
      - name: Publish from the private Oregon worker
        uses: ./.github/actions/dependency-cache
        with: {mode: launch}
        env:
          CI_CACHE_MAIN_SHA: ${{ inputs.sha }}
          CI_CACHE_RECEIPT_KEY: ${{ inputs.receipt }}
          CI_CACHE_BUILD_ID: ${{ inputs.build }}
          CI_CACHE_SEED: ${{ inputs.seed }}
