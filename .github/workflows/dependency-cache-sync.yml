name: Publish main dependency cache
run-name: Publish dependency cache · ${{ inputs.receipt || inputs.build || (inputs.seed && 'bootstrap') || 'repair' }}
on:
  workflow_dispatch:
    inputs:
      receipt: {type: string, description: Exact protected main worker receipt key}
      build: {type: string, description: Completed native main worker build ID}
      sha: {type: string, description: Commit of the original native worker}
      seed: {type: boolean, default: false, description: Exercise Gradle and OCI to bootstrap the cache}
permissions: {}
concurrency:
  group: migrations-main-dependency-cache-publish
  queue: max
jobs:
  sync:
    uses: ./.github/workflows/dependency-cache-publish.yml
    permissions: {contents: read, id-token: write}
    secrets: {AWS_CI_CONFIG: '${{ secrets.AWS_CI_CONFIG }}'}
    with:
      receipt: ${{ inputs.receipt }}
      build: ${{ inputs.build }}
      sha: ${{ inputs.sha || github.sha }}
      seed: ${{ inputs.seed }}
  acknowledge:
    needs: sync
    if: github.ref == 'refs/heads/main' && inputs.receipt != ''
    runs-on: ubuntu-24.04
    permissions: {actions: write}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - name: Retire the published receipt
        env: {GH_TOKEN: '${{ github.token }}', RECEIPT: '${{ inputs.receipt }}'}
        run: |
          [[ "$RECEIPT" =~ ^migrations-main-requests-v1-[0-9]+-[0-9]+-[0-9a-f-]{36}$ ]]
          gh cache delete "$RECEIPT" --ref refs/heads/main --repo "$GITHUB_REPOSITORY"
