name: Local Integ Tests

# Integration tests that run entirely on the runner (kind or docker compose) and need no AWS access.
# pull_request runs the candidate on a fresh hosted runner with read-only repository access.
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: '17 * * * *'     # Elasticsearch and OpenSearch source jobs
    - cron: '31 */6 * * *'   # Solr source jobs
    - cron: '47 */6 * * *'   # Release candidate canaries
  workflow_dispatch:
    inputs:
      cache-only:
        type: boolean
        default: true
        description: Require dependency broker reads from the published cache
      suite:
        type: choice
        options: [standard, matrix]
        default: standard
        description: Normal PR suite or source/target compatibility matrix
      source:
        type: string
        default: all
        description: Matrix source (for example ES_6.8), or all
      target:
        type: string
        default: all
        description: Matrix target (OS_1.3, OS_2.19, OS_3.1), or all
      test-ids:
        type: string
        description: Optional matrix override (for example 0001,0002)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The caller grants cache writes only to a main job on a recording trigger.
cache-mode: read

jobs:
  checks:
    if: (github.event_name == 'workflow_dispatch' && inputs.cache-only) || github.ref != 'refs/heads/main' || !contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    cache-mode: read
    uses: ./.github/workflows/local-integ-jobs.yml
    with:
      cache-only: ${{ github.event_name == 'workflow_dispatch' && inputs.cache-only }}
      suite: ${{ inputs.suite || 'standard' }}
      source: ${{ inputs.source || 'all' }}
      target: ${{ inputs.target || 'all' }}
      test-ids: ${{ inputs.test-ids || '' }}

  main:
    if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.cache-only) && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    cache-mode: write
    uses: ./.github/workflows/local-integ-jobs.yml
    with:
      suite: ${{ inputs.suite || 'standard' }}
      source: ${{ inputs.source || 'all' }}
      target: ${{ inputs.target || 'all' }}
      test-ids: ${{ inputs.test-ids || '' }}

  all-local-integ-checks-pass:
    needs: [checks, main]
    if: always() && (github.repository != 'AndreKurait/opensearch-migrations' || vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard
      - name: Download test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: k8s-reports-*
          path: reports
          merge-multiple: false
      - name: Summarize migration tests
        if: always()
        run: |
          {
            echo '### Migration test results'
            echo '| Source | Target | Passed | Failed |'
            echo '| --- | --- | ---: | ---: |'
            shopt -s nullglob
            for report in reports/*/*.json; do
              jq -r '.summary | "| \(.source_version) | \(.target_version) | \(.passed) | \(.failed) |"' "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !contains(needs.*.result, 'success') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo "One or more job cancelled or failed" && exit 1
      - run: |
          echo '## :heavy_check_mark: All local integ checks pass' >> "$GITHUB_STEP_SUMMARY"
