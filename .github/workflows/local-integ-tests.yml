name: Local Integ Tests

# Integration tests that run entirely on the runner (kind or docker compose) and need no AWS access.
# pull_request runs the candidate on a fresh hosted runner with read-only repository access.
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: '17 * * * *'     # Elasticsearch and OpenSearch source jobs
    - cron: '31 */6 * * *'   # Solr source jobs
    - cron: '47 */6 * * *'   # Release candidate canaries
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [standard, matrix]
        default: standard
        description: Normal PR suite or source/target compatibility matrix
      source:
        type: string
        default: all
        description: Matrix source (for example ES_6.8), or all
      target:
        type: string
        default: all
        description: Matrix target (OS_1.3, OS_2.19, OS_3.1), or all
      test-ids:
        type: string
        description: Optional matrix override (for example 0001,0002)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-tests:
    if: github.repository != 'AndreKurait/opensearch-migrations' || vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      release-ref: ${{ steps.release.outputs.ref }}
      release-repo: ${{ steps.release.outputs.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release canary ref
        id: release
        if: github.event.schedule == '47 */6 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ vars.LOCAL_INTEG_CANARY_REF }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            ref=$OVERRIDE
            repo=$GITHUB_REPOSITORY
          else
            repo=opensearch-project/opensearch-migrations
            ref=$(gh api "repos/$repo/releases/latest" | jq -er 'select(any(.assets[]; .name == "aws-bootstrap.sh")) | .tag_name')
          fi
          git check-ref-format "refs/tags/$ref"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing $repo at $ref" >> "$GITHUB_STEP_SUMMARY"
      - name: Select migrations
        id: select
        env:
          MODE: ${{ inputs.suite || 'standard' }}
          SCHEDULE: ${{ github.event.schedule }}
          SOURCE: ${{ inputs.source || 'all' }}
          TARGET: ${{ inputs.target || 'all' }}
          IDS: ${{ inputs.test-ids }}
        run: |
          case "$SCHEDULE" in
            '17 * * * *') MODE=hourly ;;
            '31 */6 * * *') MODE=solr ;;
            '47 */6 * * *') MODE=canary ;;
          esac
          matrix=$(python3 .github/scripts/local-integ-matrix.py --mode "$MODE" \
            --source "$SOURCE" --target "$TARGET" --test-ids "$IDS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "- \(.source) → \(.target) · \(.ids)"' <<< "$matrix" >> "$GITHUB_STEP_SUMMARY"

  k8s-local-test:
    needs: select-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-tests.outputs.matrix) }}
    uses: ./.github/workflows/k8s-local-test.yml
    with:
      source-version: ${{ matrix.source }}
      target-version: ${{ matrix.target }}
      test-ids: ${{ matrix.ids }}
      release-ref: ${{ needs.select-tests.outputs.release-ref }}
      release-repo: ${{ needs.select-tests.outputs.release-repo }}
      save-registry-cache: ${{ matrix.source == 'ES_7.10' && matrix.target == 'OS_3.1' }}

  docker-compose-e2e-test:
    if: github.event_name != 'schedule' && inputs.suite != 'matrix' && (github.repository != 'AndreKurait/opensearch-migrations' || vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: true
          gradle-cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          dependency-proxy-enabled: ${{ vars.DEPENDENCY_PROXY_ENABLED == 'true' }}
          dependency-proxy-docker: 'true'

      - name: Get registry cache key
        id: registry-cache-key
        if: vars.DEPENDENCY_PROXY_ENABLED != 'true'
        # Must match k8s-local-test.yml, which saves the cache.
        run: echo "key=local-integ-registry-cache-v1-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore registry cache
        if: vars.DEPENDENCY_PROXY_ENABLED != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ runner.temp }}/registry-cache
          key: ${{ steps.registry-cache-key.outputs.key }}
      - name: Start registry cache
        if: vars.DEPENDENCY_PROXY_ENABLED != 'true'
        run: ./.github/scripts/registry-cache.sh start

      - name: Build Docker images
        timeout-minutes: 30
        env:
          DOCKER_BUILD_RETRIES: 3
        run: ./buildImages/buildDockerImages.sh

      - name: Docker compose up
        timeout-minutes: 10
        run: |
          KAFKA_TRAFFIC_TOPIC="logging-traffic-topic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          KAFKA_TRAFFIC_GROUP_ID="logging-group-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            ./gradlew -p TrafficCapture dockerSolution:composeUp -PciCompose -x test -x spotlessCheck --stacktrace
          docker ps

      - name: Run E2E tests
        timeout-minutes: 15
        run: |
          docker exec "$(docker ps --filter "name=migration-console" -q)" \
            pipenv run pytest /root/lib/integ_test/integ_test/replayer_tests.py --unique_id="testindex" -s \
              --junitxml=/tmp/replayer-tests.xml

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p logs/docker logs/reports
          console=$(docker ps -aq --filter 'name=migration-console' | head -1)
          if [[ -n "$console" ]]; then
            docker cp "$console:/tmp/replayer-tests.xml" logs/reports/replayer-tests.xml || true
          fi
          for container in $(docker ps -aq); do
            container_name="$(docker inspect --format '{{.Name}}' "$container" | sed 's/\///')"
            docker logs "$container" > "logs/docker/${container_name}_logs.txt" 2>&1 || true
          done
      - name: Upload Compose logs and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-compose-e2e-logs
          if-no-files-found: warn
          path: logs/
          retention-days: 30
      - name: Stop registry cache
        if: always() && vars.DEPENDENCY_PROXY_ENABLED != 'true'
        run: ./.github/scripts/registry-cache.sh stop

  all-local-integ-checks-pass:
    needs:
      - select-tests
      - k8s-local-test
      - docker-compose-e2e-test
    if: always() && (github.repository != 'AndreKurait/opensearch-migrations' || vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Download test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: k8s-reports-*
          path: reports
          merge-multiple: false
      - name: Summarize migration tests
        if: always()
        run: |
          {
            echo '### Migration test results'
            echo '| Source | Target | Passed | Failed |'
            echo '| --- | --- | ---: | ---: |'
            shopt -s nullglob
            for report in reports/*/*.json; do
              jq -r '.summary | "| \(.source_version) | \(.target_version) | \(.passed) | \(.failed) |"' "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo "One or more job cancelled or failed" && exit 1
      - run: |
          echo '## :heavy_check_mark: All local integ checks pass' >> "$GITHUB_STEP_SUMMARY"
