name: Observe main dependency workers
on:
  workflow_run:
    workflows: [CI, Local Integ Tests, Dependency cache protocol check]
    types: [in_progress, completed]
permissions: {}
concurrency:
  group: cache-observer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  queue: max
jobs:
  observe:
    if: >-
      github.repository == 'AndreKurait/opensearch-migrations' && vars.DEPENDENCY_PROXY_ENABLED == 'true' &&
      ((github.event.workflow_run.event == 'pull_request' && github.event.action == 'completed' && github.event.workflow_run.name == 'CI') ||
       (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event))) &&
      (vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion != 'skipped'
    cache-mode: write
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions: {actions: write, contents: read}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.workflow_sha }}', persist-credentials: false}
      - name: Collect public dependency requests from completed PR checks
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          npm ci --prefix .github/ci/dependency-cache --ignore-scripts --no-audit --no-fund
          node .github/ci/dependency-cache/pr-receipts.cjs
      - name: Publish newly completed main workers
        if: github.event.workflow_run.event != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 .github/ci/dependency-cache/observe.py
