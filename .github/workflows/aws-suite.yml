name: Run an AWS integration suite
on:
  workflow_call:
    secrets:
      AWS_CI_CONFIG: {required: true}
    inputs:
      sha: {type: string, required: true}
      ref: {type: string, required: true}
      suite: {type: string, required: true}
      lane: {type: number, required: true}
      pr: {type: string, default: ''}
      parameters: {type: string, default: '{}'}
      release: {type: string, default: ''}
permissions: {}
concurrency:
  group: aws-oregon-lane-${{ inputs.lane }}
  queue: max
jobs:
  start:
    concurrency:
      group: aws-oregon-admission
      queue: max
    if: >-
      github.workflow_ref == 'AndreKurait/opensearch-migrations/.github/workflows/aws-integration.yml@refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    environment: aws-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    permissions:
      contents: read
      id-token: write
    outputs:
      build-id: ${{ steps.start.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/aws-sandbox
        with:
          config: ${{ secrets.AWS_CI_CONFIG }}
          duration: '18000'
      - name: Start disposable worker
        id: start
        env:
          AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
          SHA: ${{ inputs.sha }}
          REF: ${{ inputs.ref }}
          SUITE: ${{ inputs.suite }}
          RELEASE: ${{ inputs.release }}
          PARAMETERS: ${{ inputs.parameters }}
        run: python3 .github/ci/controller/build.py start "$SUITE" "$SHA" "$REF" "$RELEASE" "$PARAMETERS"
  watch:
    needs: start
    uses: ./.github/workflows/aws-watch.yml
    secrets: &sandbox-secret
      AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
  watch-2:
    needs: [start, watch]
    if: ${{ !cancelled() && needs.watch.result == 'success' && needs.watch.outputs.state == 'IN_PROGRESS' }}
    uses: ./.github/workflows/aws-watch.yml
    secrets: *sandbox-secret
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
      cursor: ${{ needs.watch.outputs.cursor }}
  watch-3:
    needs: [start, watch-2]
    if: ${{ !cancelled() && needs.watch-2.result == 'success' && needs.watch-2.outputs.state == 'IN_PROGRESS' }}
    uses: ./.github/workflows/aws-watch.yml
    secrets: *sandbox-secret
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
      cursor: ${{ needs.watch-2.outputs.cursor }}
  watch-4:
    needs: [start, watch-3]
    if: ${{ !cancelled() && needs.watch-3.result == 'success' && needs.watch-3.outputs.state == 'IN_PROGRESS' }}
    uses: ./.github/workflows/aws-watch.yml
    secrets: *sandbox-secret
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
      cursor: ${{ needs.watch-3.outputs.cursor }}
  outcome:
    concurrency:
      group: aws-integration-pr-status
      queue: max
    needs: [start, watch, watch-2, watch-3, watch-4]
    if: >-
      always() &&
      github.workflow_ref == 'AndreKurait/opensearch-migrations/.github/workflows/aws-integration.yml@refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - if: inputs.pr != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Record the final suite result
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          SUITE: ${{ inputs.suite }}
          PR: ${{ inputs.pr }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          state=failure
          if jq -e 'all(.[]; .result == "success" or .result == "skipped") and any(.[]; .outputs.state == "SUCCEEDED")' <<< "$NEEDS" >/dev/null; then
            state=success
          fi
          if [[ -n "$PR" ]]; then
            python3 .github/ci/controller/status.py "$state"
          fi
          echo "**$SUITE** · \`$SHA\` · **$state**" >> "$GITHUB_STEP_SUMMARY"
          test "$state" = success
  publish-main-dependencies:
    needs: [start, outcome]
    if: >-
      !cancelled() && vars.DEPENDENCY_PROXY_ENABLED == 'true' && inputs.pr == '' &&
      inputs.ref == 'refs/heads/main' && github.ref == 'refs/heads/main' && needs.start.outputs.build-id != ''
    runs-on: ubuntu-24.04
    permissions: {actions: write}
    steps:
      - name: Dispatch the protected publisher for this main worker
        env: {GH_TOKEN: '${{ github.token }}', BUILD_ID: '${{ needs.start.outputs.build-id }}', WORKER_SHA: '${{ inputs.sha }}'}
        run: gh workflow run dependency-cache-sync.yml --ref main --repo "$GITHUB_REPOSITORY" -f "build=$BUILD_ID" -f "sha=$WORKER_SHA"
