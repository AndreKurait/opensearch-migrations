name: Run an AWS integration suite
on:
  workflow_call:
    outputs:
      state:
        description: Last reported CodeBuild worker state
        value: ${{ jobs.watch-4.outputs.state || jobs.watch-3.outputs.state || jobs.watch-2.outputs.state || jobs.watch.outputs.state }}
      receipt:
        description: Whether the worker archive contains a dependency receipt
        value: ${{ jobs.watch.outputs.receipt || jobs.watch-2.outputs.receipt || jobs.watch-3.outputs.receipt || jobs.watch-4.outputs.receipt }}
      build-id:
        description: AWS CodeBuild ID for dependency receipt publication
        value: ${{ jobs.start.outputs.build-id }}
    secrets:
      AWS_CI_CONFIG: {required: true}
    inputs:
      sha: {type: string, required: true}
      ref: {type: string, required: true}
      suite: {type: string, required: true}
      lane: {type: number, required: true}
      pr: {type: string, default: ''}
      parameters: {type: string, default: '{}'}
      release: {type: string, default: ''}
permissions: {}
concurrency:
  group: aws-oregon-lane-${{ inputs.lane }}
  queue: max
jobs:
  start:
    concurrency:
      group: aws-oregon-admission
      queue: max
    if: >-
      github.workflow_ref == 'AndreKurait/opensearch-migrations/.github/workflows/aws-integration.yml@refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    environment: aws-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    permissions:
      contents: read
      id-token: write
    outputs:
      build-id: ${{ steps.start.outputs.build_id }}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            sts.us-west-2.amazonaws.com:443 sts.amazonaws.com:443 codebuild.us-west-2.amazonaws.com:443 ssm.us-west-2.amazonaws.com:443 sts.ca-central-1.amazonaws.com:443 codebuild.ca-central-1.amazonaws.com:443 ssm.ca-central-1.amazonaws.com:443
            servicequotas.us-west-2.amazonaws.com:443 ec2.us-west-2.amazonaws.com:443 servicequotas.ca-central-1.amazonaws.com:443 ec2.ca-central-1.amazonaws.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/aws-sandbox
        with:
          config: ${{ secrets.AWS_CI_CONFIG }}
          duration: '18000'
      - name: Start disposable worker
        id: start
        env:
          AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
          SHA: ${{ inputs.sha }}
          REF: ${{ inputs.ref }}
          SUITE: ${{ inputs.suite }}
          RELEASE: ${{ inputs.release }}
          PARAMETERS: ${{ inputs.parameters }}
        run: python3 .github/ci/controller/build.py start "$SUITE" "$SHA" "$REF" "$RELEASE" "$PARAMETERS"
  watch:
    needs: start
    uses: ./.github/workflows/aws-watch.yml
    secrets: &sandbox-secret
      AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
  watch-2:
    needs: [start, watch]
    if: ${{ !cancelled() && needs.watch.result == 'success' && needs.watch.outputs.state == 'IN_PROGRESS' }}
    uses: ./.github/workflows/aws-watch.yml
    secrets: *sandbox-secret
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
      cursor: ${{ needs.watch.outputs.cursor }}
  watch-3:
    needs: [start, watch-2]
    if: ${{ !cancelled() && needs.watch-2.result == 'success' && needs.watch-2.outputs.state == 'IN_PROGRESS' }}
    uses: ./.github/workflows/aws-watch.yml
    secrets: *sandbox-secret
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
      cursor: ${{ needs.watch-2.outputs.cursor }}
  watch-4:
    needs: [start, watch-3]
    if: ${{ !cancelled() && needs.watch-3.result == 'success' && needs.watch-3.outputs.state == 'IN_PROGRESS' }}
    uses: ./.github/workflows/aws-watch.yml
    secrets: *sandbox-secret
    permissions: {contents: read, id-token: write}
    with:
      build-id: ${{ needs.start.outputs.build-id }}
      suite: ${{ inputs.suite }}
      cursor: ${{ needs.watch-3.outputs.cursor }}
