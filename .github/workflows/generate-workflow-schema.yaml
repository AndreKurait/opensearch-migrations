name: Generate workflow schema standalone

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'deployment/k8s/**'
      - 'packages/schemas/**'
      - 'packages/config-processor/**'
      - 'migrationConsole/**'
      - '.github/workflows/generate-workflow-schema.yaml'
      - '.github/workflows/release-drafter.yml'
  pull_request:
    paths:
      - 'deployment/k8s/**'
      - 'packages/schemas/**'
      - 'packages/config-processor/**'
      - 'migrationConsole/**'
      - '.github/workflows/generate-workflow-schema.yaml'
      - '.github/workflows/release-drafter.yml'

jobs:
  generate-cache-key:
    if: github.repository != 'AndreKurait/opensearch-migrations' || vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      docker_cache_key: ${{ steps.generate_docker_cache_key.outputs.key }}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Docker Cache Key
        id: generate_docker_cache_key
        run: |
          files=$(find . -type f \( -name 'docker-compose.yml' -o -name 'Dockerfile' \))
          file_contents=$(cat $files)
          key=$(echo "${file_contents}" | sha1sum | awk '{print $1}')
          echo "key=${key}" >> "$GITHUB_OUTPUT"

  generate-workflow-schema:
    needs: [generate-cache-key]
    name: Generate workflow schema artifact
    runs-on: ubuntu-22.04
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
            repo.maven.apache.org:443 maven-central.storage-download.googleapis.com:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443
            auth.docker.io:443 registry-1.docker.io:443 production.cloudflare.docker.com:443 production.cloudfront.docker.com:443 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443 docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 quay.io:443 cdn01.quay.io:443 cdn02.quay.io:443 cdn03.quay.io:443 cdn04.quay.io:443 public.ecr.aws:443 d2glxqk2uabbnd.cloudfront.net:443 registry.k8s.io:443 prod-registry-k8s-io-us-east-1.s3.dualstack.us-east-1.amazonaws.com:443 prod-registry-k8s-io-us-west-2.s3.dualstack.us-west-2.amazonaws.com:443 prod-registry-k8s-io-eu-central-1.s3.dualstack.eu-central-1.amazonaws.com:443 mcr.microsoft.com:443 docker.elastic.co:443 docker-auth.elastic.co:443 docker-registry-production.d24a988e385e0074d717b6bdaea58f0d.r2.cloudflarestorage.com:443 us-west1-docker.pkg.dev:443 us-central1-docker.pkg.dev:443 us-east1-docker.pkg.dev:443 mirror.gcr.io:443 storage.googleapis.com:443
            dl.k8s.io:443 get.helm.sh:443 artifacts.elastic.co:443 download.elastic.co:443 charts.bitnami.com:443 kubernetes-sigs.github.io:443 prometheus-community.github.io:443 strimzi.io:443 argoproj.github.io:443 helm.min.io:443 opensearch-project.github.io:443
            cdn.amazonlinux.com:443 mountpoint-s3-release.s3.amazonaws.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
      - name: Require isolated execution for external fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !(false)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "::error::This external fork test requires an isolated worker. A maintainer can review the exact commit and run it from a trusted repository ref."
          exit 1
      # END generated network guard

      - name: Start the local image registry after enforcing egress
        run: docker run -d --name ci-registry --publish 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: 'true'
          gradle-cache-read-only: 'false'
          dependency-proxy-enabled: ${{ vars.DEPENDENCY_PROXY_ENABLED == 'true' }}

      - name: Alias docker-registry to 127.0.0.1
        run: |
          echo "127.0.0.1 docker-registry" | sudo tee -a /etc/hosts
          getent hosts docker-registry
          curl -sS http://docker-registry:5000/v2/ || true

      - name: Restore Docker Cache
        uses: AndreKurait/docker-cache@7a3887908bdb97935395833df69b060cfcca0f7f # 0.7.0
        with:
          key: docker-${{ runner.os }}-${{ needs.generate-cache-key.outputs.docker_cache_key }}
          read-only: ${{ github.event_name != 'push' }}

      - name: Set up Buildx builder (BuildKit)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          name: local-remote-builder
          install: true
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker-registry:5000"]
              http = true
              insecure = true

      - name: Set up Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: generate-workflow-schema
          node_image: kindest/node:v1.35.0

      - name: Build migration console image to local registry
        run: |
          ./gradlew buildKit_migrationConsole_amd64 \
            -Pbuilder=local-remote-builder \
            -PintermediateRegistry=localhost:5000 \
            -PregistryEndpoint=localhost:5000 \
            -PimageVersion=latest \
            -PpublishStyle='separateRepos' \
            --no-build-cache \
            --no-daemon \
            --no-continue \
            --info

      - name: Pull built console image from local registry
        run: |
          docker pull localhost:5000/opensearch-migrations-console:latest

      - name: Load console image into Kind
        run: |
          kind load docker-image localhost:5000/opensearch-migrations-console:latest --name generate-workflow-schema

      - name: Generate workflow schema artifact
        run: |
          chmod +x ./deployment/k8s/generateWorkflowSchemaArtifact.sh
          KUBE_CONTEXT=kind-generate-workflow-schema \
          IMAGE_REPOSITORY_PREFIX=localhost:5000 \
          IMAGE_TAG=latest \
          IMAGE_PULL_POLICY=IfNotPresent \
          OUTPUT_PATH="${PWD}/workflowMigration.schema.json" \
          ./deployment/k8s/generateWorkflowSchemaArtifact.sh

      - name: Upload workflow schema artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflowMigration-schema-${{ github.sha }}
          path: workflowMigration.schema.json

      - name: Clean up migrations docker images before caching
        if: always()
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^(migrations/|localhost:5000/opensearch-migrations-)' | xargs -r -I {} docker image rm {}

      - name: Dump schema generation diagnostics
        if: ${{ failure() }}
        run: |
          kubectl --context kind-generate-workflow-schema get nodes -o wide || true
          kubectl --context kind-generate-workflow-schema get pods -A -o wide || true
          helm --kube-context kind-generate-workflow-schema -n ma list --all || true
          helm --kube-context kind-generate-workflow-schema -n ma status ma || true
          kubectl --context kind-generate-workflow-schema -n ma get jobs,pods,events || true
          kubectl --context kind-generate-workflow-schema -n ma describe job ma-helm-installer || true
          kubectl --context kind-generate-workflow-schema -n ma logs job/ma-helm-installer --all-containers --tail=-1 || true
          kubectl --context kind-generate-workflow-schema -n ma get configmap ma-installation-notes -o yaml || true
          kubectl --context kind-generate-workflow-schema -n ma describe statefulset migration-console || true
          kubectl --context kind-generate-workflow-schema -n ma describe pod migration-console-0 || true
          kubectl --context kind-generate-workflow-schema -n ma logs migration-console-0 -c workflow-schema-generator || true
          kubectl --context kind-generate-workflow-schema -n ma logs migration-console-0 -c console || true
