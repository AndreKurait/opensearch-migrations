name: Release dry-run

# Secret-free rehearsal of the release-drafter build path. Builds every release
# artifact (Maven, Docker images, Helm chart, CFN templates, bootstrap script,
# and the migration-companion image) against a job-local registry and uploads
# them as workflow artifacts. Nothing is published and no secrets are used, so
# this runs on any fork.
#
# Use it to catch release-build regressions before tagging — e.g. a companion
# Dockerfile that COPYs a context dir the staging task no longer produces would
# fail here instead of in the real release. Run it on your fork from the
# Actions tab ("Release dry-run" > "Run workflow") on the commit you intend to
# tag, and confirm it is green before pushing the release tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to simulate (e.g. 3.3.5)'
        required: true
        default: '0.0.0-dryrun'

env:
  java-version: '21'
  gradle-version: '8.12.1'
  RELEASE_TAG: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  release-dryrun:
    name: Build all release artifacts (dry-run)
    runs-on: ubuntu-24.04
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
            repo.maven.apache.org:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443
            auth.docker.io:443 registry-1.docker.io:443 production.cloudflare.docker.com:443 production.cloudfront.docker.com:443 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 quay.io:443 cdn01.quay.io:443 cdn02.quay.io:443 cdn03.quay.io:443 cdn04.quay.io:443 public.ecr.aws:443 d2glxqk2uabbnd.cloudfront.net:443 registry.k8s.io:443 us-west1-docker.pkg.dev:443 us-central1-docker.pkg.dev:443 us-east1-docker.pkg.dev:443 mirror.gcr.io:443 storage.googleapis.com:443
            dl.k8s.io:443 get.helm.sh:443 artifacts.elastic.co:443 download.elastic.co:443 charts.bitnami.com:443 kubernetes-sigs.github.io:443 prometheus-community.github.io:443 strimzi.io:443 argoproj.github.io:443 helm.min.io:443 opensearch-project.github.io:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=cbe9fcb83fbc2c55d5734c9640f58696755156d3f9b68467f3672c35e2a6aec5
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
      # END generated network guard

      - name: Validate version
        run: '[[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]'

      - name: Alias docker-registry to 127.0.0.1
        run: |
          echo "127.0.0.1 docker-registry" | sudo tee -a /etc/hosts
          getent hosts docker-registry
          curl -sS http://docker-registry:5000/v2/ || true

      - name: Start the local image registry after enforcing egress
        run: docker run -d --name ci-registry --publish 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx builder (BuildKit)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          buildkitd-flags: --debug
          name: local-remote-builder
          install: true
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker-registry:5000"]
              http = true
              insecure = true

      - name: Create source archive
        run: |
          git archive --format=tar.gz \
            -o opensearch-migrations-source.tar.gz \
            HEAD

      - name: Build Maven artifacts
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          ./gradlew publishMavenJavaPublicationToMavenRepository \
            -Dbuild.snapshot=false \
            -Dbuild.version="0.$RELEASE_TAG" \
          && tar -C build -czf opensearch-migrations-build.tar.gz repository

      - name: Rehearse source signing and Maven Central packaging with an ephemeral key
        run: .github/scripts/release-rehearsal.sh

      - name: Build Docker images to local registry
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          ./gradlew :buildImages:buildImagesToRegistry \
            -Pbuilder=local-remote-builder \
            -PintermediateRegistry=localhost:5000 \
            -PregistryEndpoint=localhost:5000 \
            -PimageVersion="$RELEASE_TAG" \
            -PpublishStyle='separateRepos' \
            -Dbuild.snapshot=false \
            -Dbuild.version="0.$RELEASE_TAG" \
            --no-build-cache \
            --no-daemon \
            --no-continue \
            --info

      - name: Build minified CFN templates
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          STACK_NAME_SUFFIX="" ./gradlew :deployment:migration-assistant-solution:cdkSynthMinified

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Package Helm chart
        run: |
          ./gradlew \
            :deployment:k8s:packageMigrationAssistantHelmChart \
            -PhelmChartVersion="$RELEASE_TAG"

      - name: Build Migration Companion image to local registry
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          ./gradlew :deployment:k8s:migrationCompanion:buildMigrationCompanionImageToRegistry \
            -Pbuilder=local-remote-builder \
            -PregistryEndpoint=localhost:5000 \
            -PpublishStyle='separateRepos' \
            -PimageVersion="$RELEASE_TAG" \
            --no-build-cache \
            --no-daemon \
            --no-continue \
            --info

      - name: Promote all six image indexes to local version and latest tags
        env:
          STAGING_REGISTRY: localhost:5000
          DESTINATION_REGISTRY: localhost:5000/promoted
        run: .github/scripts/release-promote-images.sh

      - name: Export Docker images as tarballs
        run: |
          mkdir -p docker-images
          # The promoted namespace contains exactly the six release image indexes.
          curl -fsS 'http://localhost:5000/v2/_catalog?n=1000' | jq -er '.repositories[] | select(startswith("promoted/"))' > "$RUNNER_TEMP/image-names"
          while IFS= read -r repo; do
            name=${repo#promoted/}
            # The registry check verifies both architectures. Export the runner's image for docker load.
            docker pull "localhost:5000/$repo:$RELEASE_TAG"
            docker save "localhost:5000/$repo:$RELEASE_TAG" | gzip > "docker-images/$name.tar.gz"
          done < "$RUNNER_TEMP/image-names"

      - name: Assemble self-contained aws-bootstrap.sh
        run: |
          deployment/k8s/aws/assemble-bootstrap.sh

      - name: Upload source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-archive
          path: opensearch-migrations-source.tar.gz

      - name: Upload Maven build archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maven-build
          path: opensearch-migrations-build.tar.gz

      - name: Upload CFN templates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cfn-templates
          path: deployment/migration-assistant-solution/cdk.out-minified/*-eks.template.json

      - name: Upload Helm chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helm-chart
          path: deployment/k8s/build/helm-package/migration-assistant-${{ inputs.version }}.tgz

      - name: Upload aws-bootstrap.sh
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aws-bootstrap
          path: deployment/k8s/aws/dist/aws-bootstrap.sh

      - name: Upload Docker images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-images
          path: docker-images/*.tar.gz
          if-no-files-found: error
