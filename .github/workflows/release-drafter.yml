name: Release drafter

# Push events to every tag not containing "/"
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  java-version: '21'
  gradle-version: '8.12.1'
  RELEASE_TAG: ${{ github.ref_name }}
  STAGING_REGISTRY: ${{ vars.RELEASE_STAGING_REGISTRY || (github.repository == 'opensearch-project/opensearch-migrations' && 'opensearchstaging') || '' }}
  SOLUTIONS_S3_URI: ${{ vars.RELEASE_SOLUTIONS_S3_URI || (github.repository == 'opensearch-project/opensearch-migrations' && 's3://cornerstone-amazonaws/SO0290') || '' }}

permissions:
  contents: read

jobs:
  draft-a-release:
    name: Build and publish the prerelease
    if: >-
      github.ref_type == 'tag' && github.ref_protected &&
      (github.repository == 'opensearch-project/opensearch-migrations' || vars.RELEASE_DRAFT_ENABLED == 'true')
    runs-on: ubuntu-22.04
    environment: release-approval
    permissions:
      id-token: write
      contents: write
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
            repo.maven.apache.org:443 maven-central.storage-download.googleapis.com:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443
            auth.docker.io:443 registry-1.docker.io:443 production.cloudflare.docker.com:443 production.cloudfront.docker.com:443 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443 docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 quay.io:443 cdn01.quay.io:443 cdn02.quay.io:443 cdn03.quay.io:443 cdn04.quay.io:443 public.ecr.aws:443 d2glxqk2uabbnd.cloudfront.net:443 registry.k8s.io:443 prod-registry-k8s-io-us-east-1.s3.dualstack.us-east-1.amazonaws.com:443 prod-registry-k8s-io-us-west-2.s3.dualstack.us-west-2.amazonaws.com:443 prod-registry-k8s-io-eu-central-1.s3.dualstack.eu-central-1.amazonaws.com:443 mcr.microsoft.com:443 docker.elastic.co:443 docker-auth.elastic.co:443 docker-registry-production.d24a988e385e0074d717b6bdaea58f0d.r2.cloudflarestorage.com:443 us-west1-docker.pkg.dev:443 us-central1-docker.pkg.dev:443 us-east1-docker.pkg.dev:443 mirror.gcr.io:443 storage.googleapis.com:443
            dl.k8s.io:443 get.helm.sh:443 artifacts.elastic.co:443 download.elastic.co:443 charts.bitnami.com:443 kubernetes-sigs.github.io:443 prometheus-community.github.io:443 strimzi.io:443 argoproj.github.io:443 helm.min.io:443 opensearch-project.github.io:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
      # END generated network guard

      - name: Validate release settings
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          : "${STAGING_REGISTRY:?Set RELEASE_STAGING_REGISTRY}" "${SOLUTIONS_S3_URI:?Set RELEASE_SOLUTIONS_S3_URI}"
      - name: Alias docker-registry to 127.0.0.1
        run: |
          echo "127.0.0.1 docker-registry" | sudo tee -a /etc/hosts
          getent hosts docker-registry
          curl -sS http://docker-registry:5000/v2/ || true
      - name: Start the local image registry after enforcing egress
        run: docker run -d --name ci-registry --publish 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx builder (BuildKit)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          # Keep debug on while we troubleshoot this new registry setup
          buildkitd-flags: --debug
          # This has to match the -Pbuilder flag for buildImages/build.gradle
          name: local-remote-builder
          install: true
          # ALLOW ACCESS TO HOST NETWORK (Required to see localhost:5000 for docker registry)
          driver-opts: network=host
          # CONFIGURE INSECURE REGISTRY (Required for HTTP for docker registry)
          buildkitd-config-inline: |
            [registry."docker-registry:5000"]
              http = true
              insecure = true
      - name: Create source archive
        run: |
          git archive --format=tar.gz \
            -o opensearch-migrations-source.tar.gz \
            HEAD
      - name: Build Maven release repository
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          ./gradlew publishMavenJavaPublicationToMavenRepository -Dbuild.snapshot=false -Dbuild.version=0.$RELEASE_TAG && tar -C build -czf opensearch-migrations-build.tar.gz repository
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.MIGRATIONS_DOCKER_USERNAME }}
          password: ${{ secrets.RELEASE_STAGING_DOCKER_TOKEN }}
      - name: Build and Push Docker Images
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          # Preface Traffic Capture version with 0. to signal interface immaturity
          ./gradlew :buildImages:buildImagesToRegistry \
            -Pbuilder=local-remote-builder \
            -PintermediateRegistry=localhost:5000 \
            -PregistryEndpoint="$STAGING_REGISTRY" \
            -PimageVersion=$RELEASE_TAG \
            -PpublishStyle='separateRepos' \
            -Dbuild.snapshot=false \
            -Dbuild.version=0.$RELEASE_TAG \
            --no-build-cache \
            --no-daemon \
            --no-continue \
            --info
      - name: Build minified CFN templates for GitHub release
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          STACK_NAME_SUFFIX="" ./gradlew :deployment:migration-assistant-solution:cdkSynthMinified
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Package Helm chart
        run: |
          ./gradlew \
            :deployment:k8s:packageMigrationAssistantHelmChart \
            -PhelmChartVersion="$RELEASE_TAG"
      - name: Build and Push Migration Companion Image
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: |
          ./gradlew :deployment:k8s:migrationCompanion:buildMigrationCompanionImageToRegistry \
            -Pbuilder=local-remote-builder \
            -PregistryEndpoint="$STAGING_REGISTRY" \
            -PpublishStyle='separateRepos' \
            -PimageVersion=$RELEASE_TAG \
            --no-build-cache \
            --no-daemon \
            --no-continue \
            --info
      - name: Pull images from DockerHub for SBOM scanning
        run: |
          # Pull images that were just pushed to DockerHub
          docker pull "$STAGING_REGISTRY"/opensearch-migrations-console:$RELEASE_TAG
          docker pull "$STAGING_REGISTRY"/opensearch-migrations-traffic-replayer:$RELEASE_TAG
          docker pull "$STAGING_REGISTRY"/opensearch-migrations-traffic-capture-proxy:$RELEASE_TAG
          docker pull "$STAGING_REGISTRY"/opensearch-migrations-reindex-from-snapshot:$RELEASE_TAG
          docker pull "$STAGING_REGISTRY"/opensearch-migrations-transformation-shim:$RELEASE_TAG
          docker pull "$STAGING_REGISTRY"/opensearch-migrations-migration-companion:$RELEASE_TAG
          # Tag them with the expected names for SBOM scanning
          docker tag "$STAGING_REGISTRY"/opensearch-migrations-console:$RELEASE_TAG migrations/migration_console:latest
          docker tag "$STAGING_REGISTRY"/opensearch-migrations-traffic-replayer:$RELEASE_TAG migrations/traffic_replayer:latest
          docker tag "$STAGING_REGISTRY"/opensearch-migrations-traffic-capture-proxy:$RELEASE_TAG migrations/capture_proxy:latest
          docker tag "$STAGING_REGISTRY"/opensearch-migrations-reindex-from-snapshot:$RELEASE_TAG migrations/reindex_from_snapshot:latest
          docker tag "$STAGING_REGISTRY"/opensearch-migrations-transformation-shim:$RELEASE_TAG migrations/transformation_shim:latest
          docker tag "$STAGING_REGISTRY"/opensearch-migrations-migration-companion:$RELEASE_TAG migrations/migration_companion:latest
      - name: Generate SBOM for migration_console
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: migrations/migration_console:latest
          output-file: opensearch-migrations-console-sbom.spdx.json
      - name: Generate SBOM for traffic_replayer
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: migrations/traffic_replayer:latest
          output-file: opensearch-migrations-traffic-replayer-sbom.spdx.json
      - name: Generate SBOM for capture_proxy
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: migrations/capture_proxy:latest
          output-file: opensearch-migrations-traffic-capture-proxy-sbom.spdx.json
      - name: Generate SBOM for reindex_from_snapshot
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: migrations/reindex_from_snapshot:latest
          output-file: opensearch-migrations-reindex-from-snapshot-sbom.spdx.json
      - name: Generate SBOM for transformation_shim
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: migrations/transformation_shim:latest
          output-file: opensearch-migrations-transformation-shim-sbom.spdx.json
      - name: Generate SBOM for migration_companion
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: migrations/migration_companion:latest
          output-file: opensearch-migrations-migration-companion-sbom.spdx.json
      - name: Generate SBOM for artifacts
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: opensearch-migrations-source.tar.gz
          output-file: opensearch-migrations-source-sbom.spdx.json
      - name: Logout to DockerHub
        if: always()
        run: docker logout
      - name: Set up Kind cluster for schema verification
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: release-schema-verification
          node_image: kindest/node:v1.35.0
      - name: Deploy Helm chart and copy generated workflow schema
        run: |
          chmod +x ./deployment/k8s/generateWorkflowSchemaArtifact.sh
          KUBE_CONTEXT=kind-release-schema-verification \
          IMAGE_REPOSITORY_PREFIX="$STAGING_REGISTRY" \
          IMAGE_TAG=$RELEASE_TAG \
          OUTPUT_PATH="${PWD}/workflowMigration.schema.json" \
          ./deployment/k8s/generateWorkflowSchemaArtifact.sh
      - name: Generate Solutions Artifact
        run: |
          ./deployment/migration-assistant-solution/package-artifacts.sh
      - name: Upload unified schema artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflowMigration-schema-${{ github.ref_name }}
          path: workflowMigration.schema.json
      - name: Dump schema verification diagnostics
        if: failure()
        run: |
          kubectl --context kind-release-schema-verification get pods -A
          kubectl --context kind-release-schema-verification -n ma describe statefulset migration-console || true
          kubectl --context kind-release-schema-verification -n ma describe pod migration-console-0 || true
          kubectl --context kind-release-schema-verification -n ma logs migration-console-0 -c workflow-schema-generator || true
          kubectl --context kind-release-schema-verification -n ma logs migration-console-0 -c console || true
      - name: Configure AWS Credentials for Solutions Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.SOLUTIONS_CREDENTIALS_ROLE }}
          aws-region: us-east-1
      - name: Assume Solutions upload role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.SOLUTIONS_UPLOAD_ROLE }}
          role-chaining: true
          aws-region: us-east-1
      - name: Upload Solutions Artifact to S3
        run: |
          metadata=$(jq -nc \
            --arg branch "$RELEASE_TAG" --arg author "$(git log -1 --format='%an')" \
            --arg commit "$GITHUB_SHA" --arg timestamp "$(git log -1 --format='%cI')" \
            --arg package "https://github.com/$GITHUB_REPOSITORY" \
            '{branch:$branch,commitauthor:$author,commitid:$commit,committimestamp:$timestamp,package:$package,
              commitmessage:("Release opensearch-migrations version " + $branch),enablequicksight:"No",
              publishpublicecrimage:"false",solutionid:"SO0290",solutionname:"migration-assistant-for-amazon-opensearch-service",solutionversion:$branch}')
          aws s3 cp deployment/migration-assistant-solution/build/artifact.zip \
            "${SOLUTIONS_S3_URI%/}/$RELEASE_TAG/$GITHUB_SHA/artifact.zip" \
            --content-type application/zip \
            --metadata "$metadata"
      - name: Assemble self-contained aws-bootstrap.sh
        # Production deploy artifact. assemble-bootstrap.sh inlines every
        # sourced helper into deployment/k8s/aws/dist/aws-bootstrap.sh.
        # This is the file operators run via curl-pipe today.
        run: |
          deployment/k8s/aws/assemble-bootstrap.sh
      - name: Draft a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          immutableCreate: true
          prerelease: true
          generateReleaseNotes: true
          artifacts: >-
            deployment/migration-assistant-solution/cdk.out-minified/*-eks.template.json,
            opensearch-migrations-source.tar.gz,
            opensearch-migrations-build.tar.gz,
            bootstrap-kiro-agent.sh,
            deployment/k8s/build/helm-package/migration-assistant-${{ github.ref_name }}.tgz,
            workflowMigration.schema.json,
            deployment/k8s/aws/dist/aws-bootstrap.sh,
            **/*.spdx.json

  promote-prerelease:
    needs: draft-a-release
    permissions:
      id-token: write
      contents: read
      issues: write
    if: vars.RELEASE_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/release-publish.yml
