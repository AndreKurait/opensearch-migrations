name: Stream AWS test output
on:
  workflow_call:
    secrets:
      AWS_CI_CONFIG: {required: true}
    inputs:
      build-id: {type: string, required: true}
      suite: {type: string, required: true}
      cursor: {type: string, default: ''}
    outputs:
      receipt:
        value: ${{ jobs.watch.outputs.receipt }}
      state:
        value: ${{ jobs.watch.outputs.state }}
      cursor:
        value: ${{ jobs.watch.outputs.cursor }}
permissions: {}
jobs:
  watch:
    if: >-
      github.workflow_ref == 'AndreKurait/opensearch-migrations/.github/workflows/aws-integration.yml@refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    environment: aws-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: read
      id-token: write
    outputs:
      receipt: ${{ steps.watch.outputs.receipt }}
      state: ${{ steps.watch.outputs.state }}
      cursor: ${{ steps.watch.outputs.cursor }}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            sts.us-west-2.amazonaws.com:443 sts.amazonaws.com:443 codebuild.us-west-2.amazonaws.com:443 cloudformation.us-west-2.amazonaws.com:443 logs.us-west-2.amazonaws.com:443 s3.us-west-2.amazonaws.com:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Keep S3 requests on the permitted regional endpoint
        run: aws configure set default.s3.addressing_style path
      - uses: ./.github/actions/aws-sandbox
        with:
          config: ${{ secrets.AWS_CI_CONFIG }}
          duration: '21600'
      - name: Stream build phases and test logs
        id: watch
        env:
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 6
          AWS_CI_CONFIG: ${{ secrets.AWS_CI_CONFIG }}
          BUILD_ID: ${{ inputs.build-id }}
          CURSOR: ${{ inputs.cursor }}
        run: |
          aws configure set default.s3.addressing_style path
          python3 .github/ci/controller/build.py watch "$BUILD_ID" "$CURSOR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.watch.outputs.artifact == 'true' }}
        with:
          name: aws-${{ inputs.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aws-test-results/
          if-no-files-found: error
          retention-days: 30
