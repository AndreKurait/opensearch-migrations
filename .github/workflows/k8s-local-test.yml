name: K8s Local Test

# Reusable workflow: one source → target migration on a single-node kind cluster.
# This workflow needs no secrets and accepts PR changes to the test suite.
on:
  workflow_call:
    inputs:
      cache-only: {type: boolean, default: false}
      source-version:
        description: 'Source version, e.g. ES_7.10'
        required: true
        type: string
      target-version:
        description: 'Target version, e.g. OS_3.1'
        required: true
        type: string
      test-ids:
        description: 'Comma-separated test IDs, or "all"'
        required: false
        type: string
        default: 'all'
      release-ref:
        description: Optional repository ref exercised by scheduled release canaries
        required: false
        type: string
      release-repo:
        description: Repository containing the release ref
        required: false
        type: string
      timeout-minutes:
        required: false
        type: number
        default: 360
      save-registry-cache:
        description: 'Publish the BuildKit cache (set on one matrix entry only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  KIND_VERSION: 'v0.31.0'
  KIND_NODE_IMAGE: 'kindest/node:v1.35.1@sha256:05d7bcdefbda08b4e038f644c4df690cdac3fba8b06f8289f30e10026720a1ab'
  KIND_CLUSTER_NAME: 'ma'

jobs:
  k8s-local-test:
    name: ${{ inputs.source-version }} → ${{ inputs.target-version }} (${{ inputs.test-ids }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      CI_DEPENDENCY_STRICT_READ: ${{ inputs.cache-only && '1' || '0' }}
      SOURCE_VERSION: ${{ inputs.source-version }}
      TARGET_VERSION: ${{ inputs.target-version }}
      TEST_IDS: ${{ inputs.test-ids }}
      TEST_REPO_DIR: ${{ inputs.release-ref != '' && 'release-candidate' || '.' }}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
            repo.maven.apache.org:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443
            auth.docker.io:443 registry-1.docker.io:443 production.cloudflare.docker.com:443 production.cloudfront.docker.com:443 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443 docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 quay.io:443 cdn01.quay.io:443 cdn02.quay.io:443 cdn03.quay.io:443 cdn04.quay.io:443 public.ecr.aws:443 d2glxqk2uabbnd.cloudfront.net:443 registry.k8s.io:443 us-west1-docker.pkg.dev:443 us-central1-docker.pkg.dev:443 us-east1-docker.pkg.dev:443 mirror.gcr.io:443 storage.googleapis.com:443
            dl.k8s.io:443 get.helm.sh:443 artifacts.elastic.co:443 download.elastic.co:443 charts.bitnami.com:443 kubernetes-sigs.github.io:443 prometheus-community.github.io:443 strimzi.io:443 argoproj.github.io:443 helm.min.io:443 opensearch-project.github.io:443
            cdn.amazonlinux.com:443 mountpoint-s3-release.s3.amazonaws.com:443
            maven.search-guard.com:443
            dl-cdn.alpinelinux.org:443 artifacts.alfresco.com:443
            gcr.io:443 codeload.github.com:443 proxy.golang.org:443 sum.golang.org:443
      - name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
      - name: Require isolated execution for external fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !(false)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "::error::This external fork test requires an isolated worker. A maintainer can review the exact commit and run it from a trusted repository ref."
          exit 1
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the local integration test shell to PATH
        run: echo "$GITHUB_WORKSPACE/.github/actions/local-build-cache" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: true
          gradle-cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          dependency-proxy-enabled: ${{ inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true' }}
          dependency-proxy-docker: 'true'

      - name: Stage runner helpers
        run: |
          cp -R .github/scripts "$RUNNER_TEMP/local-integ-scripts"
          cp buildImages/backends/dockerHostedBuildkit.sh "$RUNNER_TEMP/local-integ-scripts/"
      - name: Check out release candidate
        if: inputs.release-ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.release-repo || github.repository }}
          ref: ${{ inputs.release-ref }}
          path: release-candidate
          persist-credentials: false

      - name: Configure on-demand BuildKit cache
        if: inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true'
        uses: ./.github/actions/local-build-cache
        with:
          cache-only: ${{ inputs.cache-only }}

      - name: Configure kind host
        shell: test-shell.sh {0}
        # Kubernetes 1.35 requires cgroup v2; also raises inotify limits for Fluent Bit.
        run: '"$RUNNER_TEMP/local-integ-scripts/configureKindHost.sh"'

      - name: Install kind
        shell: test-shell.sh {0}
        run: |
          KIND_INSTALL_DIR="${RUNNER_TEMP}/kind-bin" "$RUNNER_TEMP/local-integ-scripts/installKind.sh"
          echo "${RUNNER_TEMP}/kind-bin" >> "$GITHUB_PATH"

      - name: Create kind cluster
        shell: test-shell.sh {0}
        working-directory: ${{ env.TEST_REPO_DIR }}
        # Recreate the ephemeral cluster once for transient startup failures.
        run: |
          for attempt in 1 2; do
            kind delete cluster --name "$KIND_CLUSTER_NAME" || true
            if kind create cluster --name "$KIND_CLUSTER_NAME" \
                --config ./deployment/k8s/kindClusterConfigSingleNode.yaml \
                --image "$KIND_NODE_IMAGE"; then
              exit 0
            fi
            echo "::warning::kind create cluster failed (attempt ${attempt})"
          done
          exit 1

      - name: Start registry cache
        shell: test-shell.sh {0}
        if: (!inputs.cache-only && vars.DEPENDENCY_PROXY_ENABLED != 'true') || env.CI_DEPENDENCY_REGISTRY_ENDPOINT != ''
        # With an active dependency proxy the helper configures the existing kind nodes.
        run: |
          "$RUNNER_TEMP/local-integ-scripts/registry-cache.sh" start
          "$RUNNER_TEMP/local-integ-scripts/registry-cache.sh" configure-kind "$KIND_CLUSTER_NAME"

      - name: Build Docker images (BuildKit)
        shell: test-shell.sh {0}
        working-directory: ${{ env.TEST_REPO_DIR }}
        timeout-minutes: 45
        run: |
          set -eu
          kubectl config unset current-context || true
          export CI_DEPENDENCY_REGISTRY_HELPER="$RUNNER_TEMP/local-integ-scripts/registry-cache.sh"
          . "$RUNNER_TEMP/local-integ-scripts/dockerHostedBuildkit.sh"
          KUBE_CONTEXT="kind-${KIND_CLUSTER_NAME}" setup_build_backend
          kind_nodes=()
          while IFS= read -r node; do
            [ -n "$node" ] && kind_nodes+=("$node")
          done < <(kind get nodes --name "$KIND_CLUSTER_NAME")
          connect_cluster_to_registry_network kind "${kind_nodes[@]}"

          # Load-test images are their own aggregate; only 008x cases need them.
          # "008" must stay equal to LOAD_TEST_ID_PREFIX in test_runner.py.
          load_test_target=""
          if [[ ",${TEST_IDS// /}," == *",008"* ]]; then
            load_test_target=":buildImages:buildKitLoadTestAll_amd64"
          fi
          for attempt in 1 2 3; do
            if ./gradlew :buildImages:buildImagesToRegistry_amd64 :buildImages:buildKitTestAll_amd64 ${load_test_target} \
                -Pbuilder="builder-kind-${KIND_CLUSTER_NAME}" -PregistryEndpoint=localhost:5001 \
                -x test --stacktrace; then
              exit 0
            fi
            if (( attempt < 3 )); then
              echo "::warning::Image build attempt $attempt failed, retrying in 30 seconds"
              sleep 30
            fi
          done
          exit 1
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''

      - name: Publish BuildKit registry layers
        if: >-
          !inputs.cache-only && vars.DEPENDENCY_PROXY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && inputs.save-registry-cache && !inputs.release-ref
        uses: ./.github/actions/publish-buildkit-cache

      - name: Run E2E tests
        shell: test-shell.sh {0}
        working-directory: ${{ format('{0}/libraries/testAutomation', env.TEST_REPO_DIR) }}
        run: |
          python3 -m pip install pipenv==2026.5.0
          pipenv install --deploy
          mkdir -p ./reports
          kubectl config unset current-context || true
          test_ids_arg=()
          if [[ -n "$TEST_IDS" && "$TEST_IDS" != "all" ]]; then
            test_ids_arg=(--test-ids="$TEST_IDS")
          fi
          read -ra sources <<< "${SOURCE_VERSION//,/ }"
          pipenv run app --source-version "${sources[@]}" --target-version="$TARGET_VERSION" \
            "${test_ids_arg[@]}" \
            --test-reports-dir=./reports --copy-logs \
            --registry-prefix='docker-registry:5001/' \
            --kube-context="kind-${KIND_CLUSTER_NAME}" \
            --capture-proxy-service-type=ClusterIP

      - name: Sanitize artifact name
        if: always()
        run: |
          source=${SOURCE_VERSION//[^A-Za-z0-9._-]/-}
          target=${TARGET_VERSION//[^A-Za-z0-9._-]/-}
          # Release canaries run both standard ES7 and backpressure on OS_2.19.
          echo "ARTIFACT_SUFFIX=$source-to-$target-${TEST_IDS//[^A-Za-z0-9._-]/-}" >> "$GITHUB_ENV"
      - name: Summarize test cases
        if: always()
        working-directory: ${{ env.TEST_REPO_DIR }}
        run: |
          shopt -s nullglob
          for report in libraries/testAutomation/reports/*.json; do
            jq -r '.tests[] | "- \(.result) · \(.name) (\(.duration | round)s)"' "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: k8s-reports-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ env.TEST_REPO_DIR }}/libraries/testAutomation/reports/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload application logs
        # Always, so passing runs show what the tests actually did.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: k8s-local-${{ env.ARTIFACT_SUFFIX }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ env.TEST_REPO_DIR }}/libraries/testAutomation/logs/

      - name: Stop registry cache
        if: always() && (!inputs.cache-only && vars.DEPENDENCY_PROXY_ENABLED != 'true')
        run: '"$RUNNER_TEMP/local-integ-scripts/registry-cache.sh" stop'
      - name: Show disk usage
        if: always()
        run: |
          df -h
          docker system df
