  sonarqube-analysis:
    if: *run_ci
    name: SonarQube Analysis
    runs-on: ubuntu-22.04
    steps:
    # BEGIN generated network guard
    - name: Restrict runner and container egress
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        disable-telemetry: true
        allowed-endpoints: >-
          api.github.com:443 github.com:443 raw.githubusercontent.com:443
          ${{ !inputs.cache-only && 'objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443' || '' }}
          ${{ !inputs.cache-only && 'repo.maven.apache.org:443 maven-central.storage-download.googleapis.com:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443' || '' }}
          ${{ !inputs.cache-only && 'binaries.sonarsource.com:443 sonarcloud.io:443 uploads.github.com:443' || '' }}
          ${{ !inputs.cache-only && 'auth.docker.io:443 registry-1.docker.io:443 production.cloudflare.docker.com:443 production.cloudfront.docker.com:443 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443 docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 quay.io:443 cdn01.quay.io:443 cdn02.quay.io:443 cdn03.quay.io:443 cdn04.quay.io:443 public.ecr.aws:443 d2glxqk2uabbnd.cloudfront.net:443 registry.k8s.io:443 prod-registry-k8s-io-us-east-1.s3.dualstack.us-east-1.amazonaws.com:443 prod-registry-k8s-io-us-west-2.s3.dualstack.us-west-2.amazonaws.com:443 prod-registry-k8s-io-eu-central-1.s3.dualstack.eu-central-1.amazonaws.com:443 mcr.microsoft.com:443 docker.elastic.co:443 docker-auth.elastic.co:443 docker-registry-production.d24a988e385e0074d717b6bdaea58f0d.r2.cloudflarestorage.com:443 us-west1-docker.pkg.dev:443 us-central1-docker.pkg.dev:443 us-east1-docker.pkg.dev:443 mirror.gcr.io:443 storage.googleapis.com:443' || '' }}
    - *enforce_native
    - name: Require isolated execution for external fork code
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !(false)
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        echo "::error::This external fork test requires an isolated worker. A maintainer can review the exact commit and run it from a trusted repository ref."
        exit 1
    # END generated network guard

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-env
      with:
        gradle-cache-enabled: true
        dependency-proxy-enabled: ${{ inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true' }}
        dependency-proxy-docker: 'true'
        java-required: 'false'
    - name: Start loopback SonarQube after applying the host firewall
      shell: bash
      run: |
        set -euo pipefail
        docker run -d --name ci-sonarqube --publish 127.0.0.1:9000:9000 \
          -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
          sonarqube:25.10.0.114319-community@sha256:ef0290a2deabad86a2623552712033a7107a9f5b310af00519b4ddd5b348ef4e
        for attempt in {1..60}; do
          if curl -fsS -u admin:admin http://127.0.0.1:9000/api/system/health | jq -e '.health == "GREEN"'; then exit 0; fi
          sleep 10
        done
        docker logs ci-sonarqube >&2
        exit 1
    - name: Cache SonarQube Scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ~/.sonar/cache
        key: sonar-cache
        restore-keys: sonar-cache
    - name: Generate SonarQube Token
      run: |
        echo "Generating a SonarQube token..."
        RESPONSE=$(curl -s -X POST -u "admin:admin" "http://localhost:9000/api/user_tokens/generate" \
          -d "name=github-action-token" -d "type=GLOBAL_ANALYSIS_TOKEN")

        SONAR_TOKEN=$(echo "$RESPONSE" | jq -r '.token')

        if [ "$SONAR_TOKEN" == "null" ]; then
          echo "❌ Failed to generate SonarQube token!"
          exit 1
        fi

        echo "::add-mask::$SONAR_TOKEN"
        echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV
    - name: Run SonarQube Scanner
      run: |
        set -euo pipefail
        SCANNER_VERSION="8.1.0.6389"
        SCANNER_ZIP="sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
        # Maven Central mirrors the SonarSource scanner releases and has been
        # reliable from GitHub-hosted runners; binaries.sonarsource.com has
        # started returning 403 from some egress IPs.
        SCANNER_URL="${MAVEN_REPOSITORY_URL:-https://repo1.maven.org/maven2/}org/sonarsource/scanner/cli/sonar-scanner-cli/${SCANNER_VERSION}/${SCANNER_ZIP}"
        SCANNER_SHA256="bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b"

        # Retry on transient failures (CDN flakes, partial downloads).
        # --fail makes curl exit non-zero on HTTP errors so we don't silently feed an
        # error page into unzip, --retry-all-errors covers the body-cut-off case where
        # curl saw 200 OK headers but the connection died mid-stream.
        curl --fail --location --silent --show-error \
             --retry 5 --retry-delay 5 --retry-all-errors \
             --max-time 120 \
             -o sonar-scanner-cli.zip "$SCANNER_URL"

        # Verify checksum to catch any corruption that curl could not detect.
        echo "${SCANNER_SHA256}  sonar-scanner-cli.zip" | sha256sum -c -

        # Test zip integrity before extracting so a bad download fails loudly here
        # instead of leaking partial files into $HOME.
        unzip -tq sonar-scanner-cli.zip
        unzip -q sonar-scanner-cli.zip -d "$HOME"

        export PATH="$HOME/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin:$PATH"
        sonar-scanner \
          -Dsonar.projectKey=local_project \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login=$SONAR_TOKEN
    - name: Wait for issues to be processed
      run: sleep 60
    - name: Collect issues from the server
      run: |
        curl -s -u "$SONAR_TOKEN:" \
          "http://localhost:9000/api/issues/search?componentKeys=local_project&ps=500" \
          -o issues.json

        echo "::group::SonarQube Issues"
        jq -r '.issues[] | "File: \(.component):\(.line), Rule: \(.rule), Message: \(.message)"' issues.json | sort
        echo "::endgroup::"

        jq -c '.issues | sort_by(.creationDate) | reverse | .[]' issues.json | while read -r issue; do
          FILE=$(echo "$issue" | jq -r '.component | split(":")[1]')
          LINE=$(echo "$issue" | jq -r '.line')
          MESSAGE=$(echo "$issue" | jq -r '.message')
          RULE=$(echo "$issue" | jq -r '.rule')

          echo "::error file=$FILE,line=$LINE,title=$RULE::$MESSAGE"
        done

        ISSUE_COUNT=$(jq '.total' issues.json)
        BASELINE_ISSUE_COUNT=0
        if [ "$ISSUE_COUNT" -gt "$BASELINE_ISSUE_COUNT" ]; then
          echo "❌ Build failed: Found $ISSUE_COUNT issues, which is more than the baseline of $BASELINE_ISSUE_COUNT."
          exit 1
        else
          echo "✅ Build passed: Found $ISSUE_COUNT issues, which is within the baseline of $BASELINE_ISSUE_COUNT."
        fi
    - name: Upload SonarQube Artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: sonar-reports
        path: issues.json
