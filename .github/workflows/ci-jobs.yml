name: CI checks
on:
  workflow_call:
    inputs:
      cache-only:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {contents: read, actions: read}

env:
  CI_DEPENDENCY_STRICT_READ: ${{ inputs.cache-only && '1' || '0' }}
  python-version: '3.11'
  java-version: '21'
  gradle-version: '8.12.1'
  node-version: '22.x'

jobs:
  gradle-extended-check:
    if: &run_ci github.repository != 'AndreKurait/opensearch-migrations' || vars.AWS_CI_DEVELOPMENT_PAUSE != 'true' || github.event_name == 'workflow_dispatch'
    permissions: {contents: read, actions: read}
    runs-on: ${{ vars.DEPENDENCY_PROXY_ENABLED == 'true' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        tasks:
          - spotlessCheck
          - publishToMavenLocal
    steps:
      # BEGIN generated network guard
      - &network_1
        name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            ${{ !inputs.cache-only && 'objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443' || '' }}
            ${{ !inputs.cache-only && 'repo.maven.apache.org:443 maven-central.storage-download.googleapis.com:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443' || '' }}
            ${{ !inputs.cache-only && 'azure.archive.ubuntu.com:80 azure.archive.ubuntu.com:443 us-west-2.ec2.archive.ubuntu.com:80 us-west-2.ec2.archive.ubuntu.com:443 archive.ubuntu.com:80 archive.ubuntu.com:443 security.ubuntu.com:80 security.ubuntu.com:443 packages.microsoft.com:443 packages.cloud.google.com:443' || '' }}
            ${{ !inputs.cache-only && 'mirror.gcr.io:443 storage.googleapis.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443' || '' }}
      - &enforce_native
        name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
      - name: Require isolated execution for external fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !(vars.DEPENDENCY_PROXY_ENABLED == 'true')
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "::error::This external fork test requires an isolated worker. A maintainer can review the exact commit and run it from a trusted repository ref."
          exit 1
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha) || github.sha }}
      - name: Check out isolated test source
        if: (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', path: candidate, persist-credentials: false}
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: true
          dependency-proxy-enabled: ${{ inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true' }}
      - name: Run repository checks in the isolated Linux worker
        if: (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true')
        working-directory: ${{ github.workspace }}
        env:
          CI_DEPENDENCY_TEST_SOURCE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/candidate', github.workspace) || github.workspace }}
          TASK: ${{ matrix.tasks }}
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
        run: .github/ci/dependency-cache/native-checks.sh gradle-extended "${TASK}"
      - name: Run Gradle Build
        if: ${{ !(inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') }}
        run: ./gradlew ${{matrix.tasks}}
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''

  gradle-build-macos:
    if: *run_ci
    permissions: {contents: read, actions: read}
    runs-on: macos-15
    steps:
      # BEGIN generated network guard
      - name: Enforce macOS network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
          GITHUB_META_TOKEN: ${{ github.token }}
          PUBLIC_ENDPOINTS: api.github.com:443 github.com:443 raw.githubusercontent.com:443 ${{ !inputs.cache-only && 'objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443' || '' }} ${{ !inputs.cache-only && 'repo.maven.apache.org:443 maven-central.storage-download.googleapis.com:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443' || '' }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/darwin_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/darwin_guard.py" -o "$guard"
          expected=581fa7da5f9265e38b8211c4e3a20641b1401a8c934578ca6a3098435f7fcb8c
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          /usr/bin/python3 "$guard" install
      # END generated network guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}', persist-credentials: false}
      - name: Check out the candidate snapshot for Seatbelt
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', path: candidate, persist-credentials: false}
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: false
          dependency-proxy-enabled: 'true'
      - name: Run Gradle build on macOS
        run: /usr/bin/python3 "$RUNNER_TEMP/darwin_guard.py" build
        env:
          CI_DEPENDENCY_TEST_SOURCE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/candidate', github.workspace) || github.workspace }}
      - name: Release the runner firewall after candidate execution
        if: always()
        run: sudo -n /sbin/pfctl -a com.apple/migrations-egress -F rules

  python-lint:
    if: *run_ci
    permissions: {contents: read, actions: read}
    runs-on: ${{ vars.DEPENDENCY_PROXY_ENABLED == 'true' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    steps:
      # BEGIN generated network guard
      - *network_1
      - *enforce_native
      - name: Require isolated execution for external fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !(vars.DEPENDENCY_PROXY_ENABLED == 'true')
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "::error::This external fork test requires an isolated worker. A maintainer can review the exact commit and run it from a trusted repository ref."
          exit 1
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha) || github.sha }}
      - name: Check out isolated test source
        if: (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', path: candidate, persist-credentials: false}
      - uses: ./.github/actions/setup-env
        with:
          dependency-proxy-enabled: ${{ inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true' }}
          java-required: 'false'
      - name: Run repository checks in the isolated Linux worker
        if: (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true')
        working-directory: ${{ github.workspace }}
        env:
          CI_DEPENDENCY_TEST_SOURCE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/candidate', github.workspace) || github.workspace }}
        run: .github/ci/dependency-cache/native-checks.sh python-lint
      - name: Install dependencies
        if: ${{ !(inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flake8
      - name: Analysing the code with flake8
        if: ${{ !(inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') }}
        run: |
          flake8 $(git ls-files '*.py')

  python-tests:
    if: *run_ci
    permissions: {contents: read, actions: read}
    runs-on: ${{ vars.DEPENDENCY_PROXY_ENABLED == 'true' && !startsWith(matrix.py-project, 'migrationConsole/') && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        py-project:
          - migrationConsole/lib/console_link
          - migrationConsole/cluster_tools
          - solrMigrationDevSandbox
          - libraries/testAutomation
    env:
      WORKING_DIR: ${{ startsWith(matrix.py-project, 'migrationConsole/') && format('./{0}', matrix.py-project) || startsWith(matrix.py-project, 'libraries/') && format('./{0}', matrix.py-project) || matrix.py-project == 'solrMigrationDevSandbox' && format('./{0}', matrix.py-project) || format('./TrafficCapture/dockerSolution/src/main/docker/{0}', matrix.py-project) }}
      WORKFLOW_TEST_KUBE_CONTEXT: kind-console-link-test
      # The secrets context is unavailable in a step `if`, so gate on this instead.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      # BEGIN generated network guard
      - name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
            ${{ !inputs.cache-only && 'objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443' || '' }}
            ${{ !inputs.cache-only && 'repo.maven.apache.org:443 maven-central.storage-download.googleapis.com:443 repo1.maven.org:443 plugins.gradle.org:443 plugins-artifacts.gradle.org:443 services.gradle.org:443 downloads.gradle.org:443 corretto.aws:443 cdn.amazoncorretto.com:443 pypi.org:443 files.pythonhosted.org:443' || '' }}
            ${{ !inputs.cache-only && 'auth.docker.io:443 registry-1.docker.io:443 production.cloudflare.docker.com:443 production.cloudfront.docker.com:443 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443 docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 quay.io:443 cdn01.quay.io:443 cdn02.quay.io:443 cdn03.quay.io:443 cdn04.quay.io:443 public.ecr.aws:443 d2glxqk2uabbnd.cloudfront.net:443 registry.k8s.io:443 prod-registry-k8s-io-us-east-1.s3.dualstack.us-east-1.amazonaws.com:443 prod-registry-k8s-io-us-west-2.s3.dualstack.us-west-2.amazonaws.com:443 prod-registry-k8s-io-eu-central-1.s3.dualstack.eu-central-1.amazonaws.com:443 mcr.microsoft.com:443 docker.elastic.co:443 docker-auth.elastic.co:443 docker-registry-production.d24a988e385e0074d717b6bdaea58f0d.r2.cloudflarestorage.com:443 us-west1-docker.pkg.dev:443 us-central1-docker.pkg.dev:443 us-east1-docker.pkg.dev:443 mirror.gcr.io:443 storage.googleapis.com:443' || '' }}
            ${{ !inputs.cache-only && 'dl.k8s.io:443 get.helm.sh:443 artifacts.elastic.co:443 download.elastic.co:443 charts.bitnami.com:443 kubernetes-sigs.github.io:443 prometheus-community.github.io:443 strimzi.io:443 argoproj.github.io:443 helm.min.io:443 opensearch-project.github.io:443' || '' }}
            codecov.io:443 api.codecov.io:443 cli.codecov.io:443 uploader.codecov.io:443 ingest.codecov.io:443 keybase.io:443
            ${{ !inputs.cache-only && 'azure.archive.ubuntu.com:80 azure.archive.ubuntu.com:443 us-west-2.ec2.archive.ubuntu.com:80 us-west-2.ec2.archive.ubuntu.com:443 archive.ubuntu.com:80 archive.ubuntu.com:443 security.ubuntu.com:80 security.ubuntu.com:443 packages.microsoft.com:443 packages.cloud.google.com:443' || '' }}
            ${{ !inputs.cache-only && 'cdn.amazonlinux.com:443 dl-cdn.alpinelinux.org:443' || '' }}
      - *enforce_native
      - name: Require isolated execution for external fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !(vars.DEPENDENCY_PROXY_ENABLED == 'true' && !startsWith(matrix.py-project, 'migrationConsole/'))
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "::error::This external fork test requires an isolated worker. A maintainer can review the exact commit and run it from a trusted repository ref."
          exit 1
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ ((inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && !startsWith(matrix.py-project, 'migrationConsole/')) && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha) || github.sha }}
      - name: Check out isolated test source
        if: ((inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && !startsWith(matrix.py-project, 'migrationConsole/')) && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', path: candidate, persist-credentials: false}
      - uses: ./.github/actions/setup-env
        with:
          dependency-proxy-enabled: ${{ inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true' }}
          dependency-proxy-docker: ${{ startsWith(matrix.py-project, 'migrationConsole/') }}
          java-required: 'false'

      # Set up Kind cluster for workflow integration tests (only for console_link project)
      - name: Restore verified kind and kubectl for the cluster action
        if: matrix.py-project == 'migrationConsole/lib/console_link' && env.CI_DEPENDENCY_PROXY_URL != ''
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/restore-kind-action-tools.sh v0.33.0
      - name: Set up Kind cluster
        if: matrix.py-project == 'migrationConsole/lib/console_link'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          cluster_name: console-link-test

      - name: Configure dependency proxy for kind workloads
        if: matrix.py-project == 'migrationConsole/lib/console_link' && env.CI_DEPENDENCY_REGISTRY_ENDPOINT != ''
        working-directory: ${{ github.workspace }}
        run: .github/scripts/registry-cache.sh configure-kind console-link-test

      # Verify Kind cluster is ready (only for console_link project)
      - name: Verify Kind cluster
        if: matrix.py-project == 'migrationConsole/lib/console_link'
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      - name: Install workflow test cluster dependencies
        if: matrix.py-project == 'migrationConsole/lib/console_link'
        run: ./scripts/setupWorkflowTestCluster.sh

      - name: Run repository checks in the isolated Linux worker
        if: (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && !startsWith(matrix.py-project, 'migrationConsole/')
        id: isolated_check
        working-directory: ${{ github.workspace }}
        env:
          CI_DEPENDENCY_TEST_SOURCE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/candidate', github.workspace) || github.workspace }}
          CI_HERMETIC_WORKDIR: ${{ env.WORKING_DIR }}
          CI_HERMETIC_OUTPUT_DIR: ${{ runner.temp }}/hermetic-report
        run: .github/ci/dependency-cache/native-checks.sh python-tests
      - name: Install dependencies (Pipfile)
        if: ${{ !((inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && !startsWith(matrix.py-project, 'migrationConsole/')) }}
        run: |
          python3 -m pip install pipenv==2026.5.0
          pipenv install --deploy --dev
          pipenv graph

      - name: Run tests (Pipfile)
        if: ${{ !((inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && !startsWith(matrix.py-project, 'migrationConsole/')) }}
        run: |
          pipenv run test
          pipenv run coverage xml

      - name: Get Sanitized Name
        env:
          PY_PROJECT: ${{ matrix.py-project }}
        run: echo "SANITIZED_PY_PROJECT=${PY_PROJECT//\//-}" >> $GITHUB_ENV
      - name: Upload coverage to Codecov
        if: always() && env.HAS_CODECOV_TOKEN == 'true' && ((!inputs.cache-only && vars.DEPENDENCY_PROXY_ENABLED != 'true') || startsWith(matrix.py-project, 'migrationConsole/') || steps.isolated_check.outcome == 'success')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          fail_ci_if_error: true
          flags: python
          files: ${{ ((inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && !startsWith(matrix.py-project, 'migrationConsole/')) && format('{0}/hermetic-report/coverage.xml', runner.temp) || '' }}
          disable_search: ${{ (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && !startsWith(matrix.py-project, 'migrationConsole/') }}
          skip_validation: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - name: List Docker images
        if: always()
        run: |
          echo "Recording Docker images. These include standard images pre-cached by GitHub Actions when Docker is run as root."
          docker image list --format '{{ if ne .Repository "<none>" }}{{ .Repository }}{{ if ne .Tag "<none>" }}:{{ .Tag }}{{ end }}{{ else }}{{ .ID }}{{ end }}'

  kind-setup-script-tests:
    if: *run_ci
    runs-on: ubuntu-22.04
    steps:
      # BEGIN generated network guard
      - &network_3
        name: Restrict runner and container egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443
      - &enforce_unprivileged
        name: Enforce Linux network policy before candidate checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.workflow_sha }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/linux_guard.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$POLICY_SHA/.github/ci/network/linux_guard.py" -o "$guard"
          expected=e4d53ca074837dac963d7a0cdc72a1a202d40b19e172559a8be525f146e0a878
          test "$(shasum -a 256 "$guard" | cut -d' ' -f1)" = "$expected"
          sudo /usr/bin/env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /usr/bin/python3 "$guard" install
          /usr/bin/python3 "$guard" probe
          sudo /usr/bin/python3 "$guard" lock-down
          if sudo -n true >/dev/null 2>&1 || docker info >/dev/null 2>&1; then exit 1; fi
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test kind setup scripts
        run: ./.github/scripts/tests/configureKindClusterTest.sh

  aws-controller-tests:
    if: *run_ci
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      # BEGIN generated network guard
      - *network_3
      - *enforce_unprivileged
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Check every workflow against the repository network policy
        run: python3 .github/ci/network/render.py
      - run: python3 -m unittest discover -s .github/ci/controller -v
      - run: python3 -m unittest discover -s .github/ci/aws -v
      - run: python3 -m unittest discover -s .github/ci/infra -v

  gradle-repository-tests:
    if: *run_ci
    runs-on: ${{ vars.DEPENDENCY_PROXY_ENABLED == 'true' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    steps:
      # BEGIN generated network guard
      - *network_1
      - *enforce_native
      - name: Require isolated execution for external fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !(vars.DEPENDENCY_PROXY_ENABLED == 'true')
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "::error::This external fork test requires an isolated worker. A maintainer can review the exact commit and run it from a trusted repository ref."
          exit 1
      # END generated network guard

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha) || github.sha }}
      - name: Check out isolated test source
        if: (inputs.cache-only || vars.DEPENDENCY_PROXY_ENABLED == 'true') && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
