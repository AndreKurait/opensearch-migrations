version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 22
      python: 3.11
    commands:
      - |
        set -euo pipefail
        mkdir -p "$CODEBUILD_SRC_DIR/ci-results"
        [[ "$CI_STAGE" =~ ^ci-[a-z0-9]{1,12}$ ]]
        [[ "$CI_SUITE" =~ ^[a-z][a-z0-9-]{1,48}$ ]]
        if [[ "${CI_MODE:-}" == cleanup ]]; then
          [[ "$CI_RECOVERY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          aws s3api get-object --bucket "$CI_RECOVERY_BUCKET" --key "recovery/$CI_RECOVERY_SHA256.tar.gz" /tmp/ci-cleanup.tar.gz >/dev/null
          echo "$CI_RECOVERY_SHA256  /tmp/ci-cleanup.tar.gz" | sha256sum -c -
          mkdir -p "$CODEBUILD_SRC_DIR/harness"
          tar -xzf /tmp/ci-cleanup.tar.gz -C "$CODEBUILD_SRC_DIR/harness"
        else
          [[ "$CI_GIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_GIT_REF" =~ ^(refs/pull/[1-9][0-9]*/head|refs/heads/main)$ ]]
          [[ -z "${CI_RELEASE_VERSION:-}" || "$CI_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git init -q "$CODEBUILD_SRC_DIR/harness"
          git -C "$CODEBUILD_SRC_DIR/harness" fetch --no-tags --depth=1 https://github.com/AndreKurait/opensearch-migrations.git "$CI_GIT_SHA"
          git -C "$CODEBUILD_SRC_DIR/harness" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$CODEBUILD_SRC_DIR/harness" rev-parse HEAD)" = "$CI_GIT_SHA"
          printf 'Verified candidate %s\n' "$CI_GIT_SHA"
          if [[ -n "${CI_RELEASE_VERSION:-}" ]]; then
            git init -q "$CODEBUILD_SRC_DIR/release"
            git -C "$CODEBUILD_SRC_DIR/release" fetch --no-tags --depth=1 https://github.com/opensearch-project/opensearch-migrations.git "refs/tags/$CI_RELEASE_VERSION"
            git -C "$CODEBUILD_SRC_DIR/release" checkout --quiet --detach FETCH_HEAD
            echo "Release $CI_RELEASE_VERSION at $(git -C "$CODEBUILD_SRC_DIR/release" rev-parse HEAD)"
          fi
        fi
        if [[ "${CI_MODE:-}" != cleanup ]] && ! command -v skopeo >/dev/null; then
          apt-get update -qq
          apt-get install -y -qq skopeo
        fi
        cat > /tmp/migrations-native-suite.sh <<'WORKER'
        #!/usr/bin/env bash
        set -euo pipefail
        harness="$CODEBUILD_SRC_DIR/harness"
        tool_dir=$(mktemp -d)
        trap 'rm -rf "$tool_dir"' EXIT
        fetch_tool() {
          local key=$1 origin=$2 checksum=$3 filename=$4
          local source="$origin"
          if [[ -n "${CI_DEPENDENCY_PROXY_URL:-}" ]]; then source="${CI_DEPENDENCY_PROXY_URL%/}/$key"; fi
          curl --fail --silent --show-error --location -o "$filename" "$source"
          printf '%s  %s\n' "$checksum" "$filename" | sha256sum -c -
        }
        python3 -m pip install --disable-pip-version-check pipenv==2026.5.0
        if [[ "${CI_MODE:-}" != cleanup ]]; then
          crane_file=go-containerregistry_Linux_x86_64.tar.gz
          fetch_tool "raw/crane/v0.22.1/$crane_file" \
            "https://github.com/google/go-containerregistry/releases/download/v0.22.1/$crane_file" \
            0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 "$tool_dir/crane.tgz"
          tar -xzf "$tool_dir/crane.tgz" -C "$tool_dir" crane
          install -m 0755 "$tool_dir/crane" /usr/local/bin/crane
        fi
        kubectl_path=release/v1.35.0/bin/linux/amd64/kubectl
        fetch_tool "raw/kubectl/$kubectl_path" "https://dl.k8s.io/$kubectl_path" \
          a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989 "$tool_dir/kubectl"
        install -m 0755 "$tool_dir/kubectl" /usr/local/bin/kubectl
        helm_file=helm-v3.19.2-linux-amd64.tar.gz
        fetch_tool "raw/helm/$helm_file" "https://get.helm.sh/$helm_file" \
          2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e "$tool_dir/helm.tgz"
        tar -xzf "$tool_dir/helm.tgz" -C "$tool_dir" linux-amd64/helm
        install -m 0755 "$tool_dir/linux-amd64/helm" /usr/local/bin/helm
        if [[ -n "${CI_DEPENDENCY_PROXY_URL:-}" && -x "$harness/.github/ci/infra/native-oci.cjs" ]]; then
          mkdir "$tool_dir/record"
          for tool in crane helm; do ln -s "$harness/.github/ci/infra/native-oci.cjs" "$tool_dir/record/$tool"; done
          export PATH="$tool_dir/record:$PATH"
        fi
        command -v jq && docker buildx version && docker info >/dev/null
        command="$CI_SUITE"
        if [[ "${CI_MODE:-}" == cleanup ]]; then command=cleanup; fi
        python3 -u "$harness/.github/ci/aws/run.py" "$command"
        WORKER
  build:
    commands:
      - |
        set -euo pipefail
        cd "$CODEBUILD_SRC_DIR/harness"
        if [[ -n "${CI_RELEASE_VERSION:-}" ]]; then cd "$CODEBUILD_SRC_DIR/release"; fi
        recorder="$CODEBUILD_SRC_DIR/harness/.github/ci/dependency-cache/cli.cjs"
        if [[ "${CI_MODE:-}" != cleanup && "${CI_GIT_REF:-}" == refs/heads/main && -f "$recorder" ]]; then
          export CI_DEPENDENCY_RECEIPT="$CODEBUILD_SRC_DIR/ci-results/dependency-requests.json"
          export CI_CACHE_TRUSTED_DOCKER=1
          node "$recorder" record-worker -- bash /tmp/migrations-native-suite.sh
        else
          bash /tmp/migrations-native-suite.sh
        fi
artifacts:
  base-directory: ci-results
  files:
    - '**/*.xml'
    - '**/summary.json'
    - 'dependency-requests.json'
  enable-symlinks: no
